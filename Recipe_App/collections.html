<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeVerse · Collections</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .page-header {
            padding: 30px 0 10px;
        }
        .page-header h1 {
            font-size: 36px;
            font-weight: 700;
            color: #0b182b;
        }
        .page-header p {
            color: #40546b;
            font-size: 16px;
            margin-top: 4px;
        }
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
            margin: 30px 0 60px;
        }
        .collection-card {
            background: #fff;
            border-radius: 32px;
            padding: 0;
            overflow: hidden;
            border: 1px solid #f0f3f9;
            transition: 0.25s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.01);
        }
        .collection-card:hover {
            transform: translateY(-6px);
            border-color: #dce4f0;
            box-shadow: 0 24px 64px rgba(0,0,0,0.04);
        }
        .collection-card .coll-img {
            height: 160px;
            background: #f2f6fd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: #1d304a;
        }
        .collection-card .coll-body {
            padding: 20px 24px 26px;
        }
        .collection-card .coll-body h3 {
            font-size: 20px;
            font-weight: 700;
            color: #0b182b;
        }
        .collection-card .coll-body p {
            font-size: 14px;
            color: #40546b;
            margin: 4px 0 10px;
        }
        .collection-card .coll-body .coll-meta {
            font-size: 13px;
            color: #5c738d;
            display: flex;
            gap: 16px;
        }
        .collection-card .coll-body .coll-meta i {
            color: #e85d3a;
            margin-right: 4px;
        }
        .collection-card .coll-body .btn-coll {
            background: #0b182b;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .collection-card .coll-body .btn-coll:hover {
            background: #e85d3a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(232, 93, 58, 0.2);
        }

        /* ===== COLLECTION EXPLORE MODAL ===== */
        .explore-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.35s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .explore-modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .explore-modal {
            background: #ffffff;
            max-width: 820px;
            width: 100%;
            border-radius: 48px;
            padding: 32px 36px 44px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.15);
            transform: scale(0.94) translateY(24px);
            transition: 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .explore-modal-overlay.open .explore-modal {
            transform: scale(1) translateY(0);
        }
        .explore-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f3f9;
        }
        .explore-modal .modal-header .modal-title-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .explore-modal .modal-header .modal-title-group .coll-icon {
            font-size: 32px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d304a;
            flex-shrink: 0;
        }
        .explore-modal .modal-header .modal-title-group h2 {
            font-size: 26px;
            font-weight: 700;
            color: #0b182b;
        }
        .explore-modal .modal-header .modal-title-group .coll-count {
            font-size: 13px;
            color: #5c738d;
            font-weight: 400;
        }
        .explore-modal .modal-close {
            background: #f1f4fa;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 60px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            color: #1f2f44;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .explore-modal .modal-close:hover {
            background: #e3eaf5;
        }
        .explore-modal .modal-desc {
            font-size: 15px;
            color: #40546b;
            margin: 12px 0 20px;
            line-height: 1.5;
        }

        /* Recipe grid inside modal */
        .explore-modal .modal-recipes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 8px;
        }
        .explore-modal .modal-recipes .modal-recipe-card {
            background: #fafbfd;
            border-radius: 24px;
            padding: 16px 16px 20px;
            border: 1px solid #f0f3f9;
            transition: 0.2s;
            cursor: pointer;
            text-align: center;
        }
        .explore-modal .modal-recipes .modal-recipe-card:hover {
            transform: translateY(-4px);
            border-color: #dce4f0;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.04);
        }
        .explore-modal .modal-recipes .modal-recipe-card .mrc-img {
            font-size: 40px;
            background: #f2f6fd;
            border-radius: 20px;
            padding: 16px;
            color: #1d304a;
            margin-bottom: 10px;
        }
        .explore-modal .modal-recipes .modal-recipe-card .mrc-name {
            font-weight: 700;
            font-size: 15px;
            color: #0b182b;
            margin-bottom: 2px;
        }
        .explore-modal .modal-recipes .modal-recipe-card .mrc-meta {
            font-size: 12px;
            color: #5c738d;
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .explore-modal .modal-recipes .modal-recipe-card .mrc-meta i {
            color: #e85d3a;
            margin-right: 3px;
        }
        .explore-modal .modal-recipes .modal-recipe-card .mrc-view-btn {
            margin-top: 10px;
            background: transparent;
            border: 1px solid #e3e9f2;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
            color: #2f405a;
            cursor: pointer;
            transition: 0.2s;
        }
        .explore-modal .modal-recipes .modal-recipe-card .mrc-view-btn:hover {
            background: #0b182b;
            color: #fff;
            border-color: #0b182b;
        }
        .explore-modal .modal-empty {
            text-align: center;
            padding: 40px 20px;
            color: #6b7f99;
        }
        .explore-modal .modal-empty i {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 12px;
        }
        .explore-modal .modal-empty h4 {
            font-size: 18px;
            color: #0b182b;
        }

        /* Toast */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #0b182b;
            color: #fff;
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            opacity: 0;
            visibility: hidden;
            transition: 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
            z-index: 1100;
            pointer-events: none;
        }
        .toast-message.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .toast-message i {
            margin-right: 10px;
            color: #e85d3a;
        }

        @media (max-width: 600px) {
            .explore-modal {
                padding: 20px 16px 28px;
                border-radius: 32px;
            }
            .explore-modal .modal-header .modal-title-group h2 {
                font-size: 20px;
            }
            .explore-modal .modal-header .modal-title-group .coll-icon {
                font-size: 24px;
                width: 44px;
                height: 44px;
            }
            .explore-modal .modal-recipes {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
            .explore-modal .modal-recipes .modal-recipe-card .mrc-img {
                font-size: 30px;
                padding: 12px;
            }
            .collection-grid {
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
        }
        @media (max-width: 420px) {
            .explore-modal .modal-recipes {
                grid-template-columns: 1fr;
            }
            .collection-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container nav-wrapper">
            <div class="logo" onclick="location.href='index.html'">
                <i class="fas fa-utensils"></i> RecipeVerse
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="recipes.html">Recipes</a>
                <a href="chef.html">Chef</a>
                <a href="collections.html" class="active">Collections</a>
                <a href="community.html">Community</a>
            </div>
            <div class="nav-actions">
                <div class="search-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search collections..." id="searchInput" />
                </div>
                <button class="btn-outline" id="favoritesBtn">
                    <i class="far fa-heart"></i> Favorites
                    <span id="favCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>Collections</h1>
            <p>Curated recipe collections for every mood and occasion.</p>
        </div>

        <div class="collection-grid" id="collectionGrid"></div>
    </main>

    <footer class="container footer">
        <span>© 2026 RecipeVerse — cook with passion</span>
        <div class="footer-links">
            <a href="#" data-footer-filter="healthy"><i class="fas fa-seedling"></i> healthy</a>
            <span class="footer-divider">·</span>
            <a href="#" data-footer-filter="quick"><i class="fas fa-clock"></i> quick</a>
            <span class="footer-divider">·</span>
            <a href="#" data-footer-filter="delicious"><i class="fas fa-heart"></i> delicious</a>
        </div>
    </footer>

    <!-- ===== EXPLORE MODAL (Collections) ===== -->
    <div class="explore-modal-overlay" id="exploreModalOverlay">
        <div class="explore-modal">
            <div class="modal-header">
                <div class="modal-title-group">
                    <div class="coll-icon" id="exploreIcon"><i class="fas fa-folder"></i></div>
                    <div>
                        <h2 id="exploreTitle">Collection Name</h2>
                        <span class="coll-count" id="exploreCount">0 recipes</span>
                    </div>
                </div>
                <button class="modal-close" id="exploreModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-desc" id="exploreDesc">Collection description goes here.</div>
            <div class="modal-recipes" id="exploreRecipesGrid"></div>
        </div>
    </div>

    <!-- ===== RECIPE DETAIL MODAL (from script.js) ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-panel" id="modalPanel">
            <div class="modal-header">
                <h2 id="modalTitle">Recipe name</h2>
                <button class="modal-close" id="closeModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- dynamic -->
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-message" id="toastMessage">
        <i class="fas fa-check-circle"></i> <span id="toastText">Recipe opened!</span>
    </div>

    <script src="script.js"></script>
    <script>
        (function() {
            "use strict";

            // ---------- Collection data ----------
            const collections = [
                { id: 'summer-fresh', name: "Summer Fresh", desc: "Light, vibrant dishes perfect for warm days.", count: 0, icon: "fa-sun", color: "#fef9e7" },
                { id: 'quick-easy', name: "Quick & Easy", desc: "Delicious meals in 20 minutes or less.", count: 0, icon: "fa-clock", color: "#eaf4f4" },
                { id: 'vegan-delights', name: "Vegan Delights", desc: "Plant-based recipes that wow.", count: 0, icon: "fa-seedling", color: "#e6f5e9" },
                { id: 'comfort-food', name: "Comfort Food", desc: "Soul-warming classics for cozy nights.", count: 0, icon: "fa-heart", color: "#fef0e8" },
                { id: 'date-night', name: "Date Night", desc: "Impressive dishes for a romantic dinner.", count: 0, icon: "fa-glass-cheers", color: "#f3e8ff" },
                { id: 'breakfast-club', name: "Breakfast Club", desc: "Start your day with the most important meal.", count: 0, icon: "fa-sunrise", color: "#fff3e0" },
                { id: 'global-flavors', name: "Global Flavors", desc: "Travel the world through your taste buds.", count: 0, icon: "fa-globe", color: "#e3f0fa" },
                { id: 'healthy-living', name: "Healthy Living", desc: "Nutritious recipes that don't compromise on flavor.", count: 0, icon: "fa-heartbeat", color: "#e8f5e9" }
            ];

            // ---------- Map collections to recipe IDs ----------
            const collectionRecipeMap = {
                'summer-fresh': [2, 5, 8],
                'quick-easy': [2, 5, 8],
                'vegan-delights': [2, 3, 5, 8],
                'comfort-food': [4, 6, 7],
                'date-night': [1, 4, 6, 9],
                'breakfast-club': [2, 5],
                'global-flavors': [1, 3, 9],
                'healthy-living': [2, 3, 5, 8]
            };

            // ---------- DOM refs ----------
            const grid = document.getElementById('collectionGrid');
            const exploreOverlay = document.getElementById('exploreModalOverlay');
            const exploreClose = document.getElementById('exploreModalClose');
            const exploreTitle = document.getElementById('exploreTitle');
            const exploreDesc = document.getElementById('exploreDesc');
            const exploreIcon = document.getElementById('exploreIcon');
            const exploreCount = document.getElementById('exploreCount');
            const exploreRecipesGrid = document.getElementById('exploreRecipesGrid');
            const toastMessage = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');

            // ---------- Toast ----------
            let toastTimer = null;

            function showToast(msg) {
                toastText.textContent = msg;
                toastMessage.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastMessage.classList.remove('show');
                }, 2800);
            }

            // ---------- Get recipes from global scope ----------
            function getRecipes() {
                if (window.recipes && Array.isArray(window.recipes)) {
                    return window.recipes;
                }
                return [];
            }

            // ---------- Explore a collection ----------
            function exploreCollection(collectionId) {
                const coll = collections.find(c => c.id === collectionId);
                if (!coll) return;

                const recipes = getRecipes();
                const recipeIds = collectionRecipeMap[collectionId] || [];
                const collRecipes = recipes.filter(r => recipeIds.includes(r.id));

                coll.count = collRecipes.length;

                exploreTitle.textContent = coll.name;
                exploreDesc.textContent = coll.desc;
                exploreIcon.style.background = coll.color;
                exploreIcon.innerHTML = `<i class="fas ${coll.icon}"></i>`;
                exploreCount.textContent = `${collRecipes.length} recipe${collRecipes.length !== 1 ? 's' : ''}`;

                if (collRecipes.length === 0) {
                    exploreRecipesGrid.innerHTML = `
                        <div class="modal-empty" style="grid-column:1/-1;">
                            <i class="fas fa-utensils"></i>
                            <h4>No recipes yet</h4>
                            <p>We're adding new recipes to this collection soon!</p>
                        </div>
                    `;
                } else {
                    let html = '';
                    collRecipes.forEach(r => {
                        const isFav = window.favorites && window.favorites.has ? window.favorites.has(r.id) : false;
                        html += `
                            <div class="modal-recipe-card" data-id="${r.id}">
                                <div class="mrc-img"><i class="fas ${r.icon}"></i></div>
                                <div class="mrc-name">${r.name}</div>
                                <div class="mrc-meta">
                                    <span><i class="far fa-clock"></i> ${r.time}</span>
                                    <span><i class="fas fa-fire"></i> ${r.kcal} kcal</span>
                                </div>
                                <button class="mrc-view-btn" data-id="${r.id}">
                                    <i class="fas fa-eye"></i> View Recipe
                                </button>
                            </div>
                        `;
                    });
                    exploreRecipesGrid.innerHTML = html;

                    // Attach view events to each "View Recipe" button
                    exploreRecipesGrid.querySelectorAll('.mrc-view-btn').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const id = parseInt(this.dataset.id);
                            // Use the global openModal function from script.js
                            if (typeof window.openModal === 'function') {
                                window.openModal(id);
                                // Close explore modal after a short delay so the user sees the recipe modal
                                setTimeout(() => {
                                    closeExploreModal();
                                }, 100);
                                showToast('Opening recipe...');
                            } else {
                                showToast('Recipe details available in the main app.');
                            }
                        });
                    });

                    // Allow clicking the whole card too
                    exploreRecipesGrid.querySelectorAll('.modal-recipe-card').forEach(card => {
                        card.addEventListener('click', function() {
                            const id = parseInt(this.dataset.id);
                            if (typeof window.openModal === 'function') {
                                window.openModal(id);
                                setTimeout(() => {
                                    closeExploreModal();
                                }, 100);
                                showToast('Opening recipe...');
                            }
                        });
                    });
                }

                exploreOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            // ---------- Close explore modal ----------
            function closeExploreModal() {
                exploreOverlay.classList.remove('open');
                document.body.style.overflow = '';
            }

            // ---------- Render collections ----------
            function renderCollections() {
                const recipes = getRecipes();
                collections.forEach(c => {
                    const ids = collectionRecipeMap[c.id] || [];
                    c.count = recipes.filter(r => ids.includes(r.id)).length;
                });

                let html = '';
                collections.forEach(c => {
                    html += `
                        <div class="collection-card" data-collection="${c.id}">
                            <div class="coll-img" style="background:${c.color}"><i class="fas ${c.icon}"></i></div>
                            <div class="coll-body">
                                <h3>${c.name}</h3>
                                <p>${c.desc}</p>
                                <div class="coll-meta">
                                    <span><i class="fas fa-utensils"></i> ${c.count} recipe${c.count !== 1 ? 's' : ''}</span>
                                </div>
                                <button class="btn-coll explore-btn" data-collection="${c.id}">
                                    <i class="fas fa-arrow-right"></i> Explore
                                </button>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;

                grid.querySelectorAll('.explore-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const collId = this.dataset.collection;
                        exploreCollection(collId);
                    });
                });
            }

            // ---------- Modal close events ----------
            exploreClose.addEventListener('click', closeExploreModal);
            exploreOverlay.addEventListener('click', function(e) {
                if (e.target === exploreOverlay) closeExploreModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeExploreModal();
            });

            // ---------- Search ----------
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    const term = this.value.trim().toLowerCase();
                    document.querySelectorAll('.collection-card').forEach(card => {
                        const name = card.querySelector('h3')?.textContent?.toLowerCase() || '';
                        const desc = card.querySelector('p')?.textContent?.toLowerCase() || '';
                        const match = name.includes(term) || desc.includes(term);
                        card.style.display = match ? '' : 'none';
                    });
                });
            }

            // ---------- Init ----------
            function init() {
                if (!window.recipes || !Array.isArray(window.recipes) || window.recipes.length === 0) {
                    let attempts = 0;
                    const checkInterval = setInterval(() => {
                        attempts++;
                        if (window.recipes && Array.isArray(window.recipes) && window.recipes.length > 0) {
                            clearInterval(checkInterval);
                            renderCollections();
                        } else if (attempts > 20) {
                            clearInterval(checkInterval);
                            renderCollections();
                        }
                    }, 200);
                } else {
                    renderCollections();
                }
            }

            window.exploreCollection = exploreCollection;
            init();

            // Re-render when favorites change
            document.addEventListener('favoritesUpdated', function() {
                if (exploreOverlay.classList.contains('open')) {
                    const currentTitle = exploreTitle.textContent;
                    const coll = collections.find(c => c.name === currentTitle);
                    if (coll) {
                        exploreCollection(coll.id);
                    }
                }
            });

            // Also re-render collections when favorites change (to update counts if needed)
            document.addEventListener('favoritesUpdated', function() {
                renderCollections();
            });

        })();
    </script>
</body>
</html>
