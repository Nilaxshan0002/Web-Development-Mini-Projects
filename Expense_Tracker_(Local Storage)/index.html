<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker | Professional</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="tracker-card" id="app">

        <!-- HEADER -->
        <div class="header">
            <div class="brand">
                <i class="fas fa-wallet"></i>
                <h1>Expense Tracker</h1>
            </div>
            <button class="clear-all-btn" id="clearAllBtn">
                <i class="fas fa-trash-alt"></i> Clear All
            </button>
        </div>

        <!-- BALANCE SUMMARY -->
        <div class="balance-grid">
            <div class="balance-card">
                <div class="label">Income</div>
                <div class="value income" id="totalIncome">$0.00</div>
            </div>
            <div class="balance-card">
                <div class="label">Expense</div>
                <div class="value expense" id="totalExpense">$0.00</div>
            </div>
            <div class="balance-card">
                <div class="label">Balance</div>
                <div class="value balance" id="totalBalance">$0.00</div>
            </div>
        </div>

        <!-- FORM -->
        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="description"><i class="fas fa-pencil-alt" style="margin-right:4px;"></i> Description</label>
                    <input type="text" id="description" placeholder="e.g. Groceries" />
                </div>
                <div class="form-group">
                    <label for="amount"><i class="fas fa-dollar-sign" style="margin-right:4px;"></i> Amount</label>
                    <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" />
                </div>
                <div class="form-group">
                    <label for="category"><i class="fas fa-tag" style="margin-right:4px;"></i> Category</label>
                    <select id="category">
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="type"><i class="fas fa-arrow-right-arrow-left" style="margin-right:4px;"></i> Type</label>
                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group" style="justify-content: flex-end;">
                    <button class="add-btn" id="addBtn">
                        <i class="fas fa-plus-circle"></i> Add
                    </button>
                </div>
            </div>
        </div>

        <!-- FILTER BAR -->
        <div class="filter-bar">
            <div class="filter-group">
                <i class="fas fa-filter"></i>
                <select id="filterType">
                    <option value="all">All</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search transactions..." />
            </div>
        </div>

        <!-- TRANSACTION LIST -->
        <div class="transaction-list-header">
            <h3><i class="fas fa-list-ul" style="margin-right:6px; color:#4b5b74;"></i> Transactions</h3>
            <span id="txCount">0</span>
        </div>

        <ul id="transactionList">
            <!-- Transactions will be rendered here -->
            <li class="empty-state">
                <i class="fas fa-receipt"></i>
                <p>No transactions yet</p>
                <span class="sub">Add your first expense or income above</span>
            </li>
        </ul>

    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
