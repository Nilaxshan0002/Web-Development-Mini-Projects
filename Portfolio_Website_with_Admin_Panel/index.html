<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio+ · Dashboard</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ===== GLOBAL RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #f5f7fc;
            color: #1a2332;
            min-height: 100vh;
            line-height: 1.5;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #eef2f8;
            padding: 2rem 1.2rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 800;
            color: #1a2332;
            margin-bottom: 2rem;
        }

        .sidebar .logo i {
            color: #4f6ef7;
            font-size: 1.8rem;
        }

        .sidebar .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1;
        }

        .sidebar .nav-menu a {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            color: #5a6e8a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: 0.2s;
            cursor: pointer;
        }

        .sidebar .nav-menu a i {
            width: 1.4rem;
            font-size: 1.1rem;
            color: #8a9bb8;
        }

        .sidebar .nav-menu a:hover {
            background: #f0f4fe;
            color: #1a2332;
        }

        .sidebar .nav-menu a.active {
            background: #f0f4fe;
            color: #1a2332;
            font-weight: 600;
        }

        .sidebar .nav-menu a.active i {
            color: #4f6ef7;
        }

        .sidebar .user-card {
            margin-top: auto;
            padding: 1rem;
            background: #f8faff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .sidebar .user-card:hover {
            background: #eef4ff;
        }

        .sidebar .user-card .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f6ef7, #7a94fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
        }

        .sidebar .user-card .user-info {
            flex: 1;
        }

        .sidebar .user-card .user-info .name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1a2332;
        }

        .sidebar .user-card .user-info .role {
            font-size: 0.75rem;
            color: #6b7f9e;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 2rem 2.5rem 3rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 1.5rem;
            }
            .mobile-toggle {
                display: flex !important;
            }
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 200;
            background: #fff;
            border: 1px solid #eef2f8;
            padding: 0.5rem 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            color: #1a2332;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eef2f8;
        }

        .top-bar h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a2332;
        }

        .top-bar .actions {
            display: flex;
            gap: 0.6rem;
        }

        .top-bar .actions button {
            background: #ffffff;
            border: 1px solid #eef2f8;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Inter', sans-serif;
            color: #1a2332;
        }

        .top-bar .actions button:hover {
            background: #f0f4fe;
            border-color: #4f6ef7;
        }

        .top-bar .actions .btn-primary {
            background: #4f6ef7;
            border-color: #4f6ef7;
            color: #fff;
        }

        .top-bar .actions .btn-primary:hover {
            background: #3a56d4;
            border-color: #3a56d4;
        }

        /* ===== CARDS / CONTENT BLOCKS ===== */
        .content-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2f8;
            margin-bottom: 2rem;
        }

        .content-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .content-card .card-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .content-card .card-header h3 i {
            color: #4f6ef7;
        }

        .content-card .card-header .badge {
            font-size: 0.8rem;
            color: #22a65e;
            background: #e6f7ed;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-weight: 600;
        }

        /* ===== GRID ===== */
        .grid-2col {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
        }

        .grid-3col {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
        }

        .stat-card {
            background: #f8faff;
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            border: 1px solid #eef2f8;
            transition: 0.2s;
        }

        .stat-card:hover {
            border-color: #4f6ef7;
            transform: translateY(-2px);
        }

        .stat-card .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a2332;
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            color: #6b7f9e;
            margin-top: 0.2rem;
        }

        .stat-card .stat-icon {
            float: right;
            font-size: 1.6rem;
            color: #4f6ef7;
            opacity: 0.4;
        }

        /* ===== TABLE ===== */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        table th {
            text-align: left;
            padding: 0.7rem 0.5rem;
            color: #6b7f9e;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid #eef2f8;
        }

        table td {
            padding: 0.7rem 0.5rem;
            border-bottom: 1px solid #f0f4fc;
            color: #1a2332;
        }

        table tr:hover td {
            background: #f8faff;
        }

        table .status-badge {
            display: inline-block;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        table .status-badge.published {
            background: #e6f7ed;
            color: #22a65e;
        }

        table .status-badge.draft {
            background: #fff3e0;
            color: #f5a623;
        }

        table .status-badge.active {
            background: #e6f7ed;
            color: #22a65e;
        }

        table .status-badge.inactive {
            background: #fee9ec;
            color: #f25a6a;
        }

        table .action-btns {
            display: flex;
            gap: 0.3rem;
        }

        table .action-btns button {
            background: transparent;
            border: none;
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            color: #6b7f9e;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        table .action-btns button:hover {
            background: #f0f4fe;
            color: #4f6ef7;
        }

        table .action-btns button.delete:hover {
            background: #fee9ec;
            color: #f25a6a;
        }

        /* ===== MEDIA GRID ===== */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .media-item {
            background: #f8faff;
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid #eef2f8;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
        }

        .media-item:hover {
            border-color: #4f6ef7;
            transform: translateY(-2px);
        }

        .media-item .media-thumb {
            height: 100px;
            background: linear-gradient(135deg, #e6edfc, #d6e2fa);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            color: #4f6ef7;
            margin-bottom: 0.5rem;
        }

        .media-item .media-name {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .media-item .media-meta {
            font-size: 0.7rem;
            color: #6b7f9e;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #ffffff;
            border-radius: 32px;
            padding: 2rem 2.5rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(0,0,0,0.2);
        }

        .modal h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .modal p {
            color: #6b7f9e;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }

        .modal .form-group {
            margin-bottom: 1rem;
        }

        .modal .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
            color: #1a2332;
        }

        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #dce5f5;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
            outline: none;
        }

        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            border-color: #4f6ef7;
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.08);
        }

        .modal .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 1.2rem;
        }

        .modal .modal-actions button {
            padding: 0.6rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid #dce5f5;
            background: transparent;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .modal .modal-actions .btn-primary {
            background: #4f6ef7;
            border-color: #4f6ef7;
            color: #fff;
        }

        .modal .modal-actions .btn-primary:hover {
            background: #3a56d4;
        }

        .modal .modal-actions .btn-secondary:hover {
            background: #f0f4fe;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid #eef2f8;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            font-size: 0.8rem;
            color: #6b7f9e;
        }

        .footer a {
            color: #5a6e8a;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
        }

        .footer a:hover {
            color: #1a2332;
            text-decoration: underline;
        }

        .footer-links {
            display: flex;
            gap: 1.6rem;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1a2332;
            color: #fff;
            padding: 0.8rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: 0.3s ease;
            z-index: 400;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .main-content {
                padding: 1rem;
            }
            .grid-2col {
                grid-template-columns: 1fr;
            }
            .grid-3col {
                grid-template-columns: 1fr 1fr;
            }
            .media-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Mobile toggle -->
    <button class="mobile-toggle" id="mobileToggle" aria-label="toggle sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <div class="app-container">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="logo"><i class="fas fa-briefcase"></i> Port+</div>
            <nav class="nav-menu">
                <a href="index.html" class="active"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="portfolio.html"><i class="fas fa-folder-open"></i> Portfolio</a>
                <a href="media.html"><i class="fas fa-image"></i> Media</a>
                <a href="blog.html"><i class="fas fa-file-alt"></i> Blog</a>
                <a href="clients.html"><i class="fas fa-users"></i> Clients</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            </nav>
            <div class="user-card" id="userCard">
                <div class="avatar">JD</div>
                <div class="user-info">
                    <div class="name">James Davis</div>
                    <div class="role">Admin · Portfolio</div>
                </div>
                <i class="fas fa-ellipsis-v" style="color:#8a9bb8; cursor:pointer;"></i>
            </div>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content">

            <!-- top bar -->
            <div class="top-bar">
                <h2><i class="fas fa-briefcase" style="color:#4f6ef7; margin-right:0.5rem;"></i> Dashboard</h2>
                <div class="actions">
                    <button class="btn-primary" id="openAddModal"><i class="fas fa-plus"></i> Add Project</button>
                    <button id="previewBtn"><i class="fas fa-eye"></i> Preview</button>
                </div>
            </div>

            <!-- stats -->
            <div class="grid-2col" style="margin-bottom:2rem;">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-folder-open"></i></div>
                    <div class="stat-number" id="totalProjects">0</div>
                    <div class="stat-label">Total Projects</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-check-circle" style="color:#22a65e;"></i></div>
                    <div class="stat-number" id="publishedProjects">0</div>
                    <div class="stat-label">Published</div>
                </div>
            </div>

            <!-- portfolio preview -->
            <div class="content-card">
                <div class="card-header">
                    <h3><i class="fas fa-star" style="color:#f5a623;"></i> Featured Projects</h3>
                    <span class="badge"><i class="fas fa-circle" style="font-size:0.5rem; margin-right:4px;"></i> <span id="publishedCount">0</span> published</span>
                </div>
                <div class="grid-3col" id="portfolioGrid">
                    <!-- injected by JS -->
                </div>
            </div>

            <!-- recent projects table -->
            <div class="content-card">
                <div class="card-header">
                    <h3><i class="fas fa-list-ul"></i> All Projects</h3>
                    <button class="btn-primary" style="padding:0.4rem 1.2rem;border-radius:40px;font-weight:600;font-size:0.85rem;border:none;background:#4f6ef7;color:#fff;cursor:pointer;font-family:'Inter',sans-serif;" id="openAddModal2"><i class="fas fa-plus"></i> New Project</button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Project</th>
                                <th>Category</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th style="text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="projectsTableBody">
                            <!-- injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- footer -->
            <footer class="footer">
                <span>© 2026 Port+ · Admin Panel</span>
                <div class="footer-links">
                    <a id="docLink">Documentation</a>
                    <a id="supportLink">Support</a>
                    <a id="privacyLink">Privacy</a>
                </div>
            </footer>
        </main>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            "use strict";

            // ----- data helpers -----
            function getProjects() {
                const data = localStorage.getItem('projects');
                if (data) return JSON.parse(data);
                const defaultProjects = [
                    { id: 1, title: "EcoShop Platform", category: "Web Design", status: "Published", date: "2026-07-15" },
                    { id: 2, title: "HealthTrack App", category: "Mobile", status: "Published", date: "2026-07-10" },
                    { id: 3, title: "Brand Identity Kit", category: "Branding", status: "Draft", date: "2026-07-05" },
                    { id: 4, title: "Analytics Dashboard", category: "Development", status: "Published", date: "2026-06-28" },
                    { id: 5, title: "Landing Page Redesign", category: "UI/UX", status: "Draft", date: "2026-06-20" },
                ];
                localStorage.setItem('projects', JSON.stringify(defaultProjects));
                return defaultProjects;
            }

            function saveProjects(projects) {
                localStorage.setItem('projects', JSON.stringify(projects));
            }

            let projects = getProjects();

            // ----- DOM refs -----
            const portfolioGrid = document.getElementById('portfolioGrid');
            const projectsTableBody = document.getElementById('projectsTableBody');
            const totalProjects = document.getElementById('totalProjects');
            const publishedProjects = document.getElementById('publishedProjects');
            const publishedCount = document.getElementById('publishedCount');
            const toast = document.getElementById('toast');
            const mobileToggle = document.getElementById('mobileToggle');
            const sidebar = document.getElementById('sidebar');

            let toastTimeout = null;

            // ----- toast helper -----
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // ----- render functions -----
            function renderPortfolio() {
                const published = projects.filter(p => p.status === 'Published').slice(0, 4);
                portfolioGrid.innerHTML = '';
                published.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'stat-card';
                    const iconMap = {
                        'Web Design': 'fa-laptop-code',
                        'Development': 'fa-code',
                        'UI/UX': 'fa-paint-brush',
                        'Branding': 'fa-pen-fancy',
                        'Mobile': 'fa-mobile-alt'
                    };
                    const icon = iconMap[p.category] || 'fa-folder';
                    div.innerHTML = `
                        <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.4rem;">
                            <i class="fas ${icon}" style="color:#4f6ef7;font-size:1.2rem;"></i>
                            <strong style="font-size:0.95rem;">${p.title}</strong>
                        </div>
                        <div style="font-size:0.75rem;color:#6b7f9e;display:flex;justify-content:space-between;">
                            <span>${p.category}</span>
                            <span>${p.date}</span>
                        </div>
                        <div style="margin-top:0.5rem;display:flex;gap:0.4rem;">
                            <button class="view-btn" data-id="${p.id}" style="background:transparent;border:1px solid #dce5f5;padding:0.15rem 0.8rem;border-radius:20px;font-size:0.7rem;cursor:pointer;font-family:'Inter',sans-serif;color:#5a6e8a;transition:0.2s;">View</button>
                            <button class="edit-btn-feat" data-id="${p.id}" style="background:transparent;border:1px solid #dce5f5;padding:0.15rem 0.8rem;border-radius:20px;font-size:0.7rem;cursor:pointer;font-family:'Inter',sans-serif;color:#5a6e8a;transition:0.2s;">Edit</button>
                        </div>
                    `;
                    portfolioGrid.appendChild(div);
                });

                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.dataset.id);
                        const project = projects.find(p => p.id === id);
                        if (project) {
                            showToast(`🔍 Viewing: ${project.title} (${project.category})`);
                        }
                    });
                });

                document.querySelectorAll('.edit-btn-feat').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.dataset.id);
                        window.location.href = `portfolio.html?edit=${id}`;
                    });
                });

                document.querySelectorAll('.stat-card').forEach((item, index) => {
                    item.addEventListener('click', function() {
                        const publishedList = projects.filter(p => p.status === 'Published').slice(0, 4);
                        const p = publishedList[index];
                        if (p) {
                            showToast(`📁 ${p.title} · ${p.category} · ${p.status}`);
                        }
                    });
                });
            }

            function renderTable() {
                projectsTableBody.innerHTML = '';
                projects.forEach(p => {
                    const tr = document.createElement('tr');
                    const statusClass = p.status === 'Published' ? 'published' : 'draft';
                    tr.innerHTML = `
                        <td><strong>${p.title}</strong></td>
                        <td>${p.category}</td>
                        <td><span class="status-badge ${statusClass}">${p.status}</span></td>
                        <td>${p.date}</td>
                        <td style="text-align:right;">
                            <div class="action-btns" style="justify-content:flex-end;">
                                <button class="edit-btn" data-id="${p.id}"><i class="fas fa-edit"></i></button>
                                <button class="delete-btn" data-id="${p.id}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    `;
                    projectsTableBody.appendChild(tr);
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = Number(this.dataset.id);
                        if (confirm('Delete this project?')) {
                            projects = projects.filter(p => p.id !== id);
                            saveProjects(projects);
                            renderAll();
                            showToast('🗑️ Project deleted');
                        }
                    });
                });

                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = Number(this.dataset.id);
                        window.location.href = `portfolio.html?edit=${id}`;
                    });
                });
            }

            function updateStats() {
                const total = projects.length;
                const published = projects.filter(p => p.status === 'Published').length;
                totalProjects.textContent = total;
                publishedProjects.textContent = published;
                publishedCount.textContent = published;
            }

            function renderAll() {
                projects = getProjects(); // refresh from localStorage
                renderPortfolio();
                renderTable();
                updateStats();
            }

            // ----- user card -----
            document.getElementById('userCard').addEventListener('click', function() {
                showToast('👤 James Davis · Admin · Portfolio+');
            });

            // ----- footer links -----
            document.getElementById('docLink').addEventListener('click', function(e) {
                e.preventDefault();
                showToast('📄 Documentation — coming soon');
            });
            document.getElementById('supportLink').addEventListener('click', function(e) {
                e.preventDefault();
                showToast('💬 Support — contact@portfolio.plus');
            });
            document.getElementById('privacyLink').addEventListener('click', function(e) {
                e.preventDefault();
                showToast('🔒 Privacy Policy — updated 2026');
            });

            // ----- preview button -----
            document.getElementById('previewBtn').addEventListener('click', function() {
                const publishedCount = projects.filter(p => p.status === 'Published').length;
                showToast(`👀 Preview mode · ${publishedCount} published projects`);
            });

            // ----- add project buttons -> redirect to portfolio -----
            document.getElementById('openAddModal').addEventListener('click', function() {
                window.location.href = 'portfolio.html?add=true';
            });
            document.getElementById('openAddModal2').addEventListener('click', function() {
                window.location.href = 'portfolio.html?add=true';
            });

            // ----- mobile toggle -----
            mobileToggle.addEventListener('click', function() {
                sidebar.classList.toggle('open');
            });

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    if (!sidebar.contains(e.target) && e.target !== mobileToggle && !mobileToggle.contains(e.target)) {
                        sidebar.classList.remove('open');
                    }
                }
            });

            // ----- init -----
            renderAll();

            // Listen for storage changes from other tabs
            window.addEventListener('storage', function(e) {
                if (e.key === 'projects') {
                    renderAll();
                }
            });

        })();
    </script>
</body>
</html>
