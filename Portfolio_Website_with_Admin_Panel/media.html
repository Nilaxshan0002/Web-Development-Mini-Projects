<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio+ · Media</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #f5f7fc;
            color: #1a2332;
            min-height: 100vh;
            line-height: 1.5;
        }
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #eef2f8;
            padding: 2rem 1.2rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 800;
            color: #1a2332;
            margin-bottom: 2rem;
        }
        .sidebar .logo i {
            color: #4f6ef7;
            font-size: 1.8rem;
        }
        .sidebar .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1;
        }
        .sidebar .nav-menu a {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            color: #5a6e8a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: 0.2s;
            cursor: pointer;
        }
        .sidebar .nav-menu a i {
            width: 1.4rem;
            font-size: 1.1rem;
            color: #8a9bb8;
        }
        .sidebar .nav-menu a:hover {
            background: #f0f4fe;
            color: #1a2332;
        }
        .sidebar .nav-menu a.active {
            background: #f0f4fe;
            color: #1a2332;
            font-weight: 600;
        }
        .sidebar .nav-menu a.active i {
            color: #4f6ef7;
        }
        .sidebar .user-card {
            margin-top: auto;
            padding: 1rem;
            background: #f8faff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .sidebar .user-card:hover {
            background: #eef4ff;
        }
        .sidebar .user-card .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f6ef7, #7a94fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
        }
        .sidebar .user-card .user-info {
            flex: 1;
        }
        .sidebar .user-card .user-info .name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1a2332;
        }
        .sidebar .user-card .user-info .role {
            font-size: 0.75rem;
            color: #6b7f9e;
        }
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 2rem 2.5rem 3rem;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 1.5rem;
            }
            .mobile-toggle {
                display: flex !important;
            }
        }
        .mobile-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 200;
            background: #fff;
            border: 1px solid #eef2f8;
            padding: 0.5rem 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            color: #1a2332;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eef2f8;
        }
        .top-bar h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a2332;
        }
        .top-bar .actions {
            display: flex;
            gap: 0.6rem;
        }
        .top-bar .actions button {
            background: #ffffff;
            border: 1px solid #eef2f8;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Inter', sans-serif;
            color: #1a2332;
        }
        .top-bar .actions button:hover {
            background: #f0f4fe;
            border-color: #4f6ef7;
        }
        .top-bar .actions .btn-primary {
            background: #4f6ef7;
            border-color: #4f6ef7;
            color: #fff;
        }
        .top-bar .actions .btn-primary:hover {
            background: #3a56d4;
            border-color: #3a56d4;
        }
        .content-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2f8;
            margin-bottom: 2rem;
        }
        .content-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .content-card .card-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .content-card .card-header h3 i {
            color: #4f6ef7;
        }
        .content-card .card-header .badge {
            font-size: 0.8rem;
            color: #6b7f9e;
            background: #f0f4fe;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-weight: 600;
        }
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
        }
        .media-item {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #eef2f8;
            overflow: hidden;
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }
        .media-item:hover {
            border-color: #4f6ef7;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(79, 110, 247, 0.08);
        }
        .media-item .media-thumb {
            position: relative;
            width: 100%;
            padding-top: 66.67%;
            background: #f0f4fe;
            overflow: hidden;
        }
        .media-item .media-thumb img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .media-item .media-thumb .type-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            pointer-events: none;
        }
        .media-item .media-thumb .type-badge.pdf {
            background: rgba(220, 50, 50, 0.85);
        }
        .media-item .media-thumb .type-badge.image {
            background: rgba(79, 110, 247, 0.8);
        }
        .media-item .media-thumb .type-badge.document {
            background: rgba(255, 165, 0, 0.8);
        }
        .media-item .media-body {
            padding: 0.8rem 1rem 1rem;
        }
        .media-item .media-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a2332;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-item .media-meta {
            font-size: 0.7rem;
            color: #6b7f9e;
            margin-top: 0.1rem;
        }
        .media-item .media-actions {
            margin-top: 0.5rem;
            display: flex;
            gap: 0.4rem;
            justify-content: flex-start;
        }
        .media-item .media-actions button {
            background: transparent;
            border: 1px solid #dce5f5;
            padding: 0.15rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            color: #5a6e8a;
            transition: 0.2s;
        }
        .media-item .media-actions button:hover {
            background: #4f6ef7;
            color: #fff;
            border-color: #4f6ef7;
        }
        .media-item .media-actions button.delete:hover {
            background: #f25a6a;
            border-color: #f25a6a;
        }
        .footer {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid #eef2f8;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            font-size: 0.8rem;
            color: #6b7f9e;
        }
        .footer a {
            color: #5a6e8a;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
        }
        .footer a:hover {
            color: #1a2332;
            text-decoration: underline;
        }
        .footer-links {
            display: flex;
            gap: 1.6rem;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1a2332;
            color: #fff;
            padding: 0.8rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: 0.3s ease;
            z-index: 400;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        /* Upload overlay (file input simulation) */
        .upload-zone {
            border: 2px dashed #dce5f5;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            color: #6b7f9e;
            transition: 0.2s;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }
        .upload-zone:hover {
            border-color: #4f6ef7;
            background: #f8faff;
        }
        .upload-zone i {
            font-size: 2rem;
            color: #4f6ef7;
            margin-bottom: 0.5rem;
            display: block;
        }
        .upload-zone .upload-text {
            font-weight: 500;
        }
        .upload-zone .upload-hint {
            font-size: 0.8rem;
            color: #8a9bb8;
        }
        @media (max-width: 480px) {
            .main-content {
                padding: 1rem;
            }
            .media-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 380px) {
            .media-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Mobile toggle -->
    <button class="mobile-toggle" id="mobileToggle" aria-label="toggle sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <div class="app-container">

        <aside class="sidebar" id="sidebar">
            <div class="logo"><i class="fas fa-briefcase"></i> Port+</div>
            <nav class="nav-menu">
                <a href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="portfolio.html"><i class="fas fa-folder-open"></i> Portfolio</a>
                <a href="media.html" class="active"><i class="fas fa-image"></i> Media</a>
                <a href="blog.html"><i class="fas fa-file-alt"></i> Blog</a>
                <a href="clients.html"><i class="fas fa-users"></i> Clients</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            </nav>
            <div class="user-card" id="userCard">
                <div class="avatar">JD</div>
                <div class="user-info">
                    <div class="name">James Davis</div>
                    <div class="role">Admin · Portfolio</div>
                </div>
                <i class="fas fa-ellipsis-v" style="color:#8a9bb8; cursor:pointer;"></i>
            </div>
        </aside>

        <main class="main-content">

            <div class="top-bar">
                <h2><i class="fas fa-image" style="color:#4f6ef7; margin-right:0.5rem;"></i> Media Library</h2>
                <div class="actions">
                    <button class="btn-primary" id="uploadBtn"><i class="fas fa-upload"></i> Upload</button>
                </div>
            </div>

            <div class="content-card">
                <div class="card-header">
                    <h3><i class="fas fa-photo-video"></i> All Media</h3>
                    <span class="badge" id="mediaCount">0 items</span>
                </div>

                <!-- Upload zone (clickable) -->
                <div class="upload-zone" id="uploadZone">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <div class="upload-text">Drop files here or click to upload</div>
                    <div class="upload-hint">Supports JPG, PNG, PDF &amp; more</div>
                </div>

                <div class="media-grid" id="mediaGrid">
                    <!-- injected by JS -->
                </div>
            </div>

            <footer class="footer">
                <span>© 2026 Port+ · Admin Panel</span>
                <div class="footer-links">
                    <a id="docLink">Documentation</a>
                    <a id="supportLink">Support</a>
                    <a id="privacyLink">Privacy</a>
                </div>
            </footer>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            "use strict";

            // ----- Image URL generator using picsum.photos with seeds -----
            function getImageUrl(seed, width, height) {
                width = width || 300;
                height = height || 200;
                return `https://picsum.photos/seed/${encodeURIComponent(seed)}/${width}/${height}`;
            }

            // ----- Default media with image URLs -----
            function getDefaultMedia() {
                return [
                    {
                        id: 1,
                        name: 'project-thumbnail-1.jpg',
                        type: 'image',
                        date: '2026-07-14',
                        imageUrl: getImageUrl('project-thumb', 400, 300)
                    },
                    {
                        id: 2,
                        name: 'logo-design-final.png',
                        type: 'image',
                        date: '2026-07-12',
                        imageUrl: getImageUrl('logo-design', 400, 300)
                    },
                    {
                        id: 3,
                        name: 'dashboard-mockup.pdf',
                        type: 'document',
                        date: '2026-07-08',
                        imageUrl: getImageUrl('dashboard-mockup', 400, 300)
                    },
                    {
                        id: 4,
                        name: 'hero-background.jpg',
                        type: 'image',
                        date: '2026-07-05',
                        imageUrl: getImageUrl('hero-bg', 400, 300)
                    }
                ];
            }

            // ----- Data helpers -----
            function getMedia() {
                const data = localStorage.getItem('mediaItems');
                if (data) {
                    const parsed = JSON.parse(data);
                    // Ensure all items have imageUrl (migrate old data)
                    let needsUpdate = false;
                    const updated = parsed.map(item => {
                        if (!item.imageUrl) {
                            needsUpdate = true;
                            const seed = item.name.replace(/\.[^/.]+$/, '') || 'media-' + item.id;
                            return { ...item, imageUrl: getImageUrl(seed, 400, 300) };
                        }
                        return item;
                    });
                    if (needsUpdate) {
                        localStorage.setItem('mediaItems', JSON.stringify(updated));
                        return updated;
                    }
                    return parsed;
                }
                const defaults = getDefaultMedia();
                localStorage.setItem('mediaItems', JSON.stringify(defaults));
                return defaults;
            }

            function saveMedia(media) {
                localStorage.setItem('mediaItems', JSON.stringify(media));
            }

            // ----- State -----
            let mediaItems = getMedia();
            let nextId = mediaItems.length ? Math.max(...mediaItems.map(m => m.id)) + 1 : 1;

            // ----- DOM refs -----
            const grid = document.getElementById('mediaGrid');
            const mediaCount = document.getElementById('mediaCount');
            const toast = document.getElementById('toast');
            const mobileToggle = document.getElementById('mobileToggle');
            const sidebar = document.getElementById('sidebar');
            const uploadZone = document.getElementById('uploadZone');

            let toastTimeout = null;

            // ----- Toast -----
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // ----- Render -----
            function renderMedia() {
                grid.innerHTML = '';
                if (mediaItems.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1; text-align:center; padding:3rem 0; color:#6b7f9e;">
                            <i class="fas fa-folder-open" style="font-size:2.4rem; color:#dce5f5; margin-bottom:0.5rem; display:block;"></i>
                            <p style="font-weight:500;">No media files yet</p>
                            <p style="font-size:0.85rem;">Click "Upload" to add your first file</p>
                        </div>
                    `;
                    mediaCount.textContent = '0 items';
                    return;
                }

                mediaItems.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'media-item';

                    const typeLabel = m.type || 'image';
                    const badgeClass = typeLabel === 'pdf' ? 'pdf' : typeLabel === 'document' ? 'document' :
                        'image';
                    const displayType = typeLabel === 'document' ? 'PDF' : typeLabel.toUpperCase();

                    div.innerHTML = `
                        <div class="media-thumb">
                            <img src="${m.imageUrl}" alt="${m.name}" loading="lazy" />
                            <span class="type-badge ${badgeClass}">${displayType}</span>
                        </div>
                        <div class="media-body">
                            <div class="media-name" title="${m.name}">${m.name}</div>
                            <div class="media-meta">${m.date}</div>
                            <div class="media-actions">
                                <button class="view-media" data-id="${m.id}"><i class="fas fa-eye"></i> View</button>
                                <button class="delete-media" data-id="${m.id}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(div);
                });

                // View event
                document.querySelectorAll('.view-media').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.dataset.id);
                        const item = mediaItems.find(m => m.id === id);
                        if (item) {
                            showToast(`🔍 Viewing: ${item.name}`);
                        }
                    });
                });

                // Delete event
                document.querySelectorAll('.delete-media').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.dataset.id);
                        if (confirm('Delete this media file?')) {
                            mediaItems = mediaItems.filter(m => m.id !== id);
                            saveMedia(mediaItems);
                            renderMedia();
                            showToast('🗑️ Media deleted');
                        }
                    });
                });

                // Click on item → view
                document.querySelectorAll('.media-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const id = Number(this.querySelector('.view-media')?.dataset.id);
                        if (id) {
                            const found = mediaItems.find(m => m.id === id);
                            if (found) showToast(`📁 ${found.name}`);
                        }
                    });
                });

                mediaCount.textContent = mediaItems.length + ' items';
            }

            // ----- Upload (simulated) -----
            function uploadFile() {
                const extensions = ['jpg', 'png', 'gif', 'svg', 'pdf', 'docx'];
                const ext = extensions[Math.floor(Math.random() * extensions.length)];
                const name = 'upload-' + Date.now() + '.' + ext;
                const type = ext === 'pdf' || ext === 'docx' ? 'document' : 'image';
                const seed = 'upload-' + Date.now();
                const imageUrl = getImageUrl(seed, 400, 300);

                mediaItems.push({
                    id: nextId++,
                    name: name,
                    type: type,
                    date: new Date().toISOString().slice(0, 10),
                    imageUrl: imageUrl
                });
                saveMedia(mediaItems);
                renderMedia();
                showToast('📤 Uploaded: ' + name);
            }

            // ----- Event Listeners -----
            document.getElementById('uploadBtn').addEventListener('click', uploadFile);
            uploadZone.addEventListener('click', uploadFile);

            // Drag-and-drop visual feedback (simulated)
            uploadZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = '#4f6ef7';
                this.style.background = '#f0f4fe';
            });
            uploadZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.style.borderColor = '#dce5f5';
                this.style.background = 'transparent';
            });
            uploadZone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.style.borderColor = '#dce5f5';
                this.style.background = 'transparent';
                uploadFile();
            });

            // ----- User card -----
            document.getElementById('userCard').addEventListener('click', function() {
                showToast('👤 James Davis · Admin · Portfolio+');
            });

            // ----- Footer links -----
            document.getElementById('docLink').addEventListener('click', function(e) {
                e.preventDefault();
                showToast('📄 Documentation — coming soon');
            });
            document.getElementById('supportLink').addEventListener('click', function(e) {
                e.preventDefault();
                showToast('💬 Support — contact@portfolio.plus');
            });
            document.getElementById('privacyLink').addEventListener('click', function(e) {
                e.preventDefault();
                showToast('🔒 Privacy Policy — updated 2026');
            });

            // ----- Mobile toggle -----
            mobileToggle.addEventListener('click', function() {
                sidebar.classList.toggle('open');
            });
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    if (!sidebar.contains(e.target) && e.target !== mobileToggle && !mobileToggle.contains(e
                        .target)) {
                        sidebar.classList.remove('open');
                    }
                }
            });

            // ----- Storage sync (cross-tab) -----
            window.addEventListener('storage', function(e) {
                if (e.key === 'mediaItems') {
                    mediaItems = getMedia();
                    renderMedia();
                }
            });

            // ----- Init -----
            renderMedia();

        })();
    </script>
</body>
</html>
