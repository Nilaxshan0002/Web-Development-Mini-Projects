<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio+ · Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* Same base styles – abbreviated */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f5f7fc; color:#1a2332; min-height:100vh; line-height:1.5; }
        .app-container { display:flex; min-height:100vh; }
        .sidebar { width:260px; background:#fff; border-right:1px solid #eef2f8; padding:2rem 1.2rem; display:flex; flex-direction:column; position:fixed; height:100vh; overflow-y:auto; z-index:100; transition:transform 0.3s ease; }
        .sidebar .logo { display:flex; align-items:center; gap:0.6rem; font-size:1.4rem; font-weight:800; color:#1a2332; margin-bottom:2rem; }
        .sidebar .logo i { color:#4f6ef7; font-size:1.8rem; }
        .sidebar .nav-menu { display:flex; flex-direction:column; gap:0.3rem; flex:1; }
        .sidebar .nav-menu a { display:flex; align-items:center; gap:0.8rem; padding:0.7rem 1rem; border-radius:12px; color:#5a6e8a; text-decoration:none; font-weight:500; font-size:0.95rem; transition:0.2s; cursor:pointer; }
        .sidebar .nav-menu a i { width:1.4rem; font-size:1.1rem; color:#8a9bb8; }
        .sidebar .nav-menu a:hover { background:#f0f4fe; color:#1a2332; }
        .sidebar .nav-menu a.active { background:#f0f4fe; color:#1a2332; font-weight:600; }
        .sidebar .nav-menu a.active i { color:#4f6ef7; }
        .sidebar .user-card { margin-top:auto; padding:1rem; background:#f8faff; border-radius:16px; display:flex; align-items:center; gap:0.8rem; cursor:pointer; transition:0.2s; }
        .sidebar .user-card:hover { background:#eef4ff; }
        .sidebar .user-card .avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#4f6ef7,#7a94fa); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:1rem; }
        .sidebar .user-card .user-info { flex:1; }
        .sidebar .user-card .user-info .name { font-weight:700; font-size:0.95rem; color:#1a2332; }
        .sidebar .user-card .user-info .role { font-size:0.75rem; color:#6b7f9e; }
        .main-content { margin-left:260px; flex:1; padding:2rem 2.5rem 3rem; }
        @media (max-width:768px) { .sidebar { transform:translateX(-100%); } .sidebar.open { transform:translateX(0); } .main-content { margin-left:0; padding:1.5rem; } .mobile-toggle { display:flex !important; } }
        .mobile-toggle { display:none; position:fixed; top:1rem; left:1rem; z-index:200; background:#fff; border:1px solid #eef2f8; padding:0.5rem 0.8rem; border-radius:12px; cursor:pointer; font-size:1.2rem; color:#1a2332; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .top-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:2rem; padding-bottom:1rem; border-bottom:1px solid #eef2f8; }
        .top-bar h2 { font-size:1.6rem; font-weight:700; color:#1a2332; }
        .top-bar .actions { display:flex; gap:0.6rem; }
        .top-bar .actions button { background:#fff; border:1px solid #eef2f8; padding:0.5rem 1.2rem; border-radius:40px; font-weight:600; font-size:0.85rem; cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:0.4rem; font-family:'Inter',sans-serif; color:#1a2332; }
        .top-bar .actions button:hover { background:#f0f4fe; border-color:#4f6ef7; }
        .top-bar .actions .btn-primary { background:#4f6ef7; border-color:#4f6ef7; color:#fff; }
        .top-bar .actions .btn-primary:hover { background:#3a56d4; border-color:#3a56d4; }
        .content-card { background:#fff; border-radius:24px; padding:2rem; box-shadow:0 2px 12px rgba(0,0,0,0.03); border:1px solid #eef2f8; margin-bottom:2rem; }
        .content-card .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; flex-wrap:wrap; gap:0.8rem; }
        .content-card .card-header h3 { font-size:1.1rem; font-weight:700; display:flex; align-items:center; gap:0.5rem; }
        .content-card .card-header h3 i { color:#4f6ef7; }
        .form-group { margin-bottom:1.2rem; }
        .form-group label { display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.2rem; color:#1a2332; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:0.7rem 1rem; border:1px solid #dce5f5; border-radius:12px; font-size:0.95rem; font-family:'Inter',sans-serif; transition:0.2s; outline:none; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#4f6ef7; box-shadow:0 0 0 4px rgba(79,110,247,0.08); }
        .btn-primary { background:#4f6ef7; border:none; color:#fff; padding:0.6rem 1.6rem; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.2s; font-family:'Inter',sans-serif; }
        .btn-primary:hover { background:#3a56d4; }
        .footer { margin-top:2rem; padding-top:1.2rem; border-top:1px solid #eef2f8; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:1rem; font-size:0.8rem; color:#6b7f9e; }
        .footer a { color:#5a6e8a; text-decoration:none; transition:0.2s; cursor:pointer; }
        .footer a:hover { color:#1a2332; text-decoration:underline; }
        .footer-links { display:flex; gap:1.6rem; }
        .toast { position:fixed; bottom:2rem; right:2rem; background:#1a2332; color:#fff; padding:0.8rem 1.6rem; border-radius:40px; font-size:0.9rem; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,0.15); opacity:0; transform:translateY(20px); transition:0.3s ease; z-index:400; pointer-events:none; }
        .toast.show { opacity:1; transform:translateY(0); }
        .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:2rem; }
        @media (max-width:768px) { .settings-grid { grid-template-columns:1fr; } }
        @media (max-width:480px) { .main-content { padding:1rem; } }
    </style>
</head>
<body>

    <button class="mobile-toggle" id="mobileToggle" aria-label="toggle sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <div class="app-container">

        <aside class="sidebar" id="sidebar">
            <div class="logo"><i class="fas fa-briefcase"></i> Port+</div>
            <nav class="nav-menu">
                <a href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="portfolio.html"><i class="fas fa-folder-open"></i> Portfolio</a>
                <a href="media.html"><i class="fas fa-image"></i> Media</a>
                <a href="blog.html"><i class="fas fa-file-alt"></i> Blog</a>
                <a href="clients.html"><i class="fas fa-users"></i> Clients</a>
                <a href="settings.html" class="active"><i class="fas fa-cog"></i> Settings</a>
            </nav>
            <div class="user-card" id="userCard">
                <div class="avatar">JD</div>
                <div class="user-info">
                    <div class="name">James Davis</div>
                    <div class="role">Admin · Portfolio</div>
                </div>
                <i class="fas fa-ellipsis-v" style="color:#8a9bb8; cursor:pointer;"></i>
            </div>
        </aside>

        <main class="main-content">

            <div class="top-bar">
                <h2><i class="fas fa-cog" style="color:#4f6ef7; margin-right:0.5rem;"></i> Settings</h2>
                <div class="actions">
                    <button class="btn-primary" id="saveSettingsBtn"><i class="fas fa-save"></i> Save Settings</button>
                </div>
            </div>

            <div class="settings-grid">
                <!-- Profile -->
                <div class="content-card">
                    <div class="card-header">
                        <h3><i class="fas fa-user-circle"></i> Profile</h3>
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="profileName" value="James Davis" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="profileEmail" value="james@portfolio.plus" />
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <input type="text" id="profileRole" value="Administrator" />
                    </div>
                </div>

                <!-- Site Settings -->
                <div class="content-card">
                    <div class="card-header">
                        <h3><i class="fas fa-globe"></i> Site Settings</h3>
                    </div>
                    <div class="form-group">
                        <label>Site Title</label>
                        <input type="text" id="siteTitle" value="Portfolio+ Admin" />
                    </div>
                    <div class="form-group">
                        <label>Default Status for New Projects</label>
                        <select id="defaultStatus">
                            <option value="Published">Published</option>
                            <option value="Draft" selected>Draft</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Items per Page</label>
                        <select id="itemsPerPage">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                </div>
            </div>

            <footer class="footer">
                <span>© 2026 Port+ · Admin Panel</span>
                <div class="footer-links">
                    <a id="docLink">Documentation</a>
                    <a id="supportLink">Support</a>
                    <a id="privacyLink">Privacy</a>
                </div>
            </footer>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            "use strict";

            function getSettings() {
                const data = localStorage.getItem('settings');
                if (data) return JSON.parse(data);
                const defaultSettings = {
                    profileName: 'James Davis',
                    profileEmail: 'james@portfolio.plus',
                    profileRole: 'Administrator',
                    siteTitle: 'Portfolio+ Admin',
                    defaultStatus: 'Draft',
                    itemsPerPage: '10'
                };
                localStorage.setItem('settings', JSON.stringify(defaultSettings));
                return defaultSettings;
            }

            function saveSettings(settings) {
                localStorage.setItem('settings', JSON.stringify(settings));
            }

            let settings = getSettings();

            // Populate fields
            document.getElementById('profileName').value = settings.profileName || '';
            document.getElementById('profileEmail').value = settings.profileEmail || '';
            document.getElementById('profileRole').value = settings.profileRole || '';
            document.getElementById('siteTitle').value = settings.siteTitle || '';
            document.getElementById('defaultStatus').value = settings.defaultStatus || 'Draft';
            document.getElementById('itemsPerPage').value = settings.itemsPerPage || '10';

            const toast = document.getElementById('toast');
            const mobileToggle = document.getElementById('mobileToggle');
            const sidebar = document.getElementById('sidebar');
            let toastTimeout = null;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // Save settings
            document.getElementById('saveSettingsBtn').addEventListener('click', function() {
                settings.profileName = document.getElementById('profileName').value.trim();
                settings.profileEmail = document.getElementById('profileEmail').value.trim();
                settings.profileRole = document.getElementById('profileRole').value.trim();
                settings.siteTitle = document.getElementById('siteTitle').value.trim();
                settings.defaultStatus = document.getElementById('defaultStatus').value;
                settings.itemsPerPage = document.getElementById('itemsPerPage').value;

                saveSettings(settings);
                showToast('✅ Settings saved');
            });

            // user card
            document.getElementById('userCard').addEventListener('click', function() {
                showToast('👤 James Davis · Admin · Portfolio+');
            });

            // footer links
            document.getElementById('docLink').addEventListener('click', function(e) { e.preventDefault(); showToast('📄 Documentation — coming soon'); });
            document.getElementById('supportLink').addEventListener('click', function(e) { e.preventDefault(); showToast('💬 Support — contact@portfolio.plus'); });
            document.getElementById('privacyLink').addEventListener('click', function(e) { e.preventDefault(); showToast('🔒 Privacy Policy — updated 2026'); });

            // mobile toggle
            mobileToggle.addEventListener('click', function() {
                sidebar.classList.toggle('open');
            });
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    if (!sidebar.contains(e.target) && e.target !== mobileToggle && !mobileToggle.contains(e.target)) {
                        sidebar.classList.remove('open');
                    }
                }
            });

            // storage sync for settings
            window.addEventListener('storage', function(e) {
                if (e.key === 'settings') {
                    settings = getSettings();
                    // re-populate
                    document.getElementById('profileName').value = settings.profileName || '';
                    document.getElementById('profileEmail').value = settings.profileEmail || '';
                    document.getElementById('profileRole').value = settings.profileRole || '';
                    document.getElementById('siteTitle').value = settings.siteTitle || '';
                    document.getElementById('defaultStatus').value = settings.defaultStatus || 'Draft';
                    document.getElementById('itemsPerPage').value = settings.itemsPerPage || '10';
                }
            });

        })();
    </script>
</body>
</html>
