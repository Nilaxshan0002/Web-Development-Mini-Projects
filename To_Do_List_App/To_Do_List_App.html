<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List · React style</title>
  <!-- Font Awesome (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ----- CSS (separated) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e6f0f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .todo-card {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 20, 30, 0.15), 0 8px 24px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: 0.3s;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      font-size: 2rem;
      color: #0b2b3b;
      letter-spacing: -0.5px;
      margin-bottom: 1.8rem;
    }
    h1 i {
      color: #2c7da0;
      font-size: 2rem;
    }

    /* add task row */
    .add-task {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 2.2rem;
    }
    .add-task input {
      flex: 1 1 200px;
      padding: 0.9rem 1.2rem;
      border: none;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02), 0 2px 6px rgba(0, 20, 30, 0.08);
      font-size: 1rem;
      transition: 0.2s;
      outline: 2px solid transparent;
    }
    .add-task input:focus {
      outline: 2px solid #2c7da0;
      background: white;
    }
    .add-task button {
      background: #1e4a5f;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 14px rgba(28, 78, 99, 0.25);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .add-task button:hover {
      background: #143b4b;
      transform: scale(1.01);
      box-shadow: 0 10px 18px rgba(20, 60, 80, 0.3);
    }
    .add-task button i {
      font-size: 1rem;
    }

    /* filter tabs */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding-bottom: 0.8rem;
    }
    .filter-btn {
      background: transparent;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #2a4a5a;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-btn i {
      font-size: 0.8rem;
      opacity: 0.7;
    }
    .filter-btn.active {
      background: #1e4a5f;
      color: white;
      box-shadow: 0 4px 8px rgba(0,30,40,0.12);
    }
    .filter-btn.active i {
      opacity: 1;
    }
    .filter-btn:not(.active):hover {
      background: rgba(30, 74, 95, 0.08);
    }

    /* task list */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin: 1.2rem 0 2rem;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .task-list li {
      background: white;
      backdrop-filter: blur(2px);
      padding: 0.7rem 1rem 0.7rem 1.5rem;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 4px 8px rgba(0, 20, 30, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: 0.15s;
      animation: fadeIn 0.2s ease;
    }
    .task-list li:hover {
      background: #f9fcff;
      border-color: #b6d2e0;
    }

    .task-list li .task-text {
      flex: 1;
      font-size: 1rem;
      color: #0b2b3b;
      word-break: break-word;
      padding-right: 6px;
    }
    .task-list li .task-text.completed {
      text-decoration: line-through;
      color: #6f8f9f;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      color: #4e6f7e;
      white-space: nowrap;
      background: rgba(200, 220, 235, 0.2);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      letter-spacing: 0.3px;
    }
    .task-meta i {
      margin-right: 2px;
      font-size: 0.65rem;
      color: #4f7f94;
    }

    /* ----- action buttons: always visible, clearly labeled ----- */
    .task-actions {
      display: flex;
      gap: 0.2rem;
      align-items: center;
      flex-shrink: 0;
    }
    .task-actions button {
      background: transparent;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 40px;
      color: #2e5b6e;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(240, 246, 250, 0.5);
      border: 1px solid rgba(200, 215, 225, 0.3);
    }
    .task-actions button:hover {
      background: rgba(30, 74, 95, 0.12);
      color: #0f3342;
      border-color: #b6d2e0;
    }
    .task-actions .delete-btn:hover {
      background: rgba(200, 60, 60, 0.12);
      color: #b13e3e;
      border-color: #f0c0c0;
    }
    .task-actions .edit-btn:hover {
      background: rgba(40, 130, 180, 0.12);
      color: #136b8a;
      border-color: #aacfdf;
    }
    .task-actions .complete-btn {
      color: #1f7a5a;
    }
    .task-actions .complete-btn:hover {
      background: rgba(40, 160, 100, 0.12);
      border-color: #a0d0b0;
    }
    /* label inside button (for clarity) */
    .task-actions button .btn-label {
      display: none;
      font-size: 0.65rem;
      font-weight: 500;
      margin-left: 4px;
      letter-spacing: 0.3px;
    }
    /* on larger screens show label */
    @media (min-width: 600px) {
      .task-actions button {
        width: auto;
        padding: 0 0.9rem;
        gap: 4px;
        border-radius: 40px;
        background: rgba(240, 246, 250, 0.4);
      }
      .task-actions button .btn-label {
        display: inline-block;
      }
      .task-actions button i {
        font-size: 0.9rem;
      }
    }

    /* empty state */
    .empty-state {
      text-align: center;
      color: #4e6f7e;
      padding: 2rem 0 0.5rem;
      font-style: italic;
      opacity: 0.7;
    }

    /* footer features */
    .features {
      margin-top: 1.8rem;
      border-top: 1px solid rgba(0,0,0,0.04);
      padding-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem 1.5rem;
      font-size: 0.8rem;
      color: #1f4a5c;
      background: rgba(255,255,255,0.2);
      border-radius: 60px;
      padding: 0.8rem 1.8rem;
      backdrop-filter: blur(2px);
    }
    .features span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 450;
    }
    .features i {
      color: #2c7da0;
      font-size: 0.8rem;
    }

    @keyframes fadeIn {
      0% { opacity: 0.4; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* scroll */
    .task-list::-webkit-scrollbar {
      width: 5px;
    }
    .task-list::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.02);
      border-radius: 20px;
    }
    .task-list::-webkit-scrollbar-thumb {
      background: #b6d2e0;
      border-radius: 20px;
    }

    /* responsive */
    @media (max-width: 600px) {
      .todo-card { padding: 1.5rem; }
      .add-task input { flex: 1 1 140px; }
      .task-list li { flex-wrap: wrap; padding: 0.7rem 1rem; border-radius: 28px; }
      .task-meta { font-size: 0.6rem; padding: 0.1rem 0.5rem; }
      .filter-btn { padding: 0.3rem 0.9rem; font-size: 0.8rem; }
      .features { font-size: 0.7rem; gap: 0.4rem 1rem; }
      .task-actions button {
        width: 34px;
        padding: 0;
      }
      .task-actions button .btn-label {
        display: none;
      }
    }
    @media (max-width: 450px) {
      .task-actions button {
        width: 30px;
        height: 30px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="todo-card" id="app">
    <h1><i class="fas fa-list-check"></i> TODO LIST</h1>

    <!-- add task -->
    <div class="add-task">
      <input type="text" id="taskInput" placeholder="Add a new task …" />
      <button id="addBtn"><i class="fas fa-plus"></i> Add</button>
    </div>

    <!-- filter -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all"><i class="fas fa-list-ul"></i> All</button>
      <button class="filter-btn" data-filter="active"><i class="fas fa-circle"></i> Active</button>
      <button class="filter-btn" data-filter="completed"><i class="fas fa-check-circle"></i> Completed</button>
    </div>

    <!-- task list -->
    <ul class="task-list" id="taskList"></ul>

    <!-- features -->
    <div class="features">
      <span><i class="fas fa-pen-to-square"></i> Add/Edit/Delete</span>
      <span><i class="fas fa-check-double"></i> Mark Complete</span>
      <span><i class="fas fa-database"></i> Local Storage</span>
      <span><i class="fas fa-filter"></i> Filter Tasks</span>
      <span><i class="fas fa-mobile-screen"></i> Responsive UI</span>
    </div>
  </div>

  <script>
    // ----- JAVASCRIPT (separated) -----
    (function() {
      "use strict";

      // DOM refs
      const taskInput = document.getElementById('taskInput');
      const addBtn = document.getElementById('addBtn');
      const taskList = document.getElementById('taskList');
      const filterBtns = document.querySelectorAll('.filter-btn');

      // State
      let tasks = [];
      let currentFilter = 'all'; // 'all' | 'active' | 'completed'

      // ----- helpers -----
      function formatDate(ts) {
        const d = new Date(ts);
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const year = d.getFullYear();
        const hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const h12 = hours % 12 || 12;
        return `${h12}:${minutes} ${ampm}, ${month}/${day}/${year}`;
      }

      // generate unique ID
      function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substr(2, 8);
      }

      // ----- load from localStorage -----
      function loadFromStorage() {
        const stored = localStorage.getItem('todoTasks');
        if (stored) {
          try {
            tasks = JSON.parse(stored);
            // ensure each task has an id (migration)
            tasks = tasks.filter(t => t && typeof t === 'object').map(t => {
              if (!t.id) t.id = generateId();
              if (t.completed === undefined) t.completed = false;
              if (!t.createdAt) t.createdAt = Date.now();
              return t;
            });
          } catch {
            tasks = [];
          }
        } else {
          // seed with demo tasks from screenshot
          tasks = [
            { id: generateId(), text: 'Create a react project 🧑‍💻', completed: false, createdAt: Date.now() - 3600000 * 2 },
            { id: generateId(), text: 'Learn React 🧑‍💻', completed: false, createdAt: Date.now() - 3600000 * 3 },
            { id: generateId(), text: 'Create a Todo App 🧑‍💻', completed: false, createdAt: Date.now() - 3600000 * 4 }
          ];
          // adjust dates to match screenshot approx
          tasks[0].createdAt = new Date(2022, 5, 1, 5, 23, 0).getTime();
          tasks[1].createdAt = new Date(2022, 5, 1, 5, 22, 0).getTime();
          tasks[2].createdAt = new Date(2022, 5, 1, 5, 21, 0).getTime();
          saveToStorage();
        }
      }

      function saveToStorage() {
        localStorage.setItem('todoTasks', JSON.stringify(tasks));
      }

      // ----- render -----
      function render() {
        const filtered = getFilteredTasks();
        taskList.innerHTML = '';

        if (filtered.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty-state';
          empty.textContent = '✨ Nothing here — add a task!';
          taskList.appendChild(empty);
          return;
        }

        filtered.forEach(task => {
          const li = document.createElement('li');
          li.dataset.id = task.id;

          // text
          const textSpan = document.createElement('span');
          textSpan.className = `task-text ${task.completed ? 'completed' : ''}`;
          textSpan.textContent = task.text;

          // meta (time)
          const meta = document.createElement('span');
          meta.className = 'task-meta';
          meta.innerHTML = `<i class="far fa-clock"></i> ${formatDate(task.createdAt)}`;

          // actions container
          const actions = document.createElement('div');
          actions.className = 'task-actions';

          // --- complete toggle (with label) ---
          const completeBtn = document.createElement('button');
          completeBtn.className = 'complete-btn';
          completeBtn.innerHTML = task.completed 
            ? '<i class="fas fa-undo"></i><span class="btn-label">Undo</span>' 
            : '<i class="fas fa-check"></i><span class="btn-label">Done</span>';
          completeBtn.title = task.completed ? 'Undo complete' : 'Mark complete';
          completeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleComplete(task.id);
          });

          // --- edit button (with label) ---
          const editBtn = document.createElement('button');
          editBtn.className = 'edit-btn';
          editBtn.innerHTML = '<i class="fas fa-pen"></i><span class="btn-label">Edit</span>';
          editBtn.title = 'Edit task';
          editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            editTask(task.id);
          });

          // --- delete button (with label) ---
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.innerHTML = '<i class="fas fa-trash-can"></i><span class="btn-label">Delete</span>';
          deleteBtn.title = 'Delete task';
          deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteTask(task.id);
          });

          actions.appendChild(completeBtn);
          actions.appendChild(editBtn);
          actions.appendChild(deleteBtn);

          li.appendChild(textSpan);
          li.appendChild(meta);
          li.appendChild(actions);
          taskList.appendChild(li);
        });
      }

      // ----- filter logic -----
      function getFilteredTasks() {
        if (currentFilter === 'all') return tasks.slice();
        if (currentFilter === 'active') return tasks.filter(t => !t.completed);
        if (currentFilter === 'completed') return tasks.filter(t => t.completed);
        return tasks;
      }

      // ----- CRUD -----
      function addTask(text) {
        if (!text.trim()) return;
        const newTask = {
          id: generateId(),
          text: text.trim(),
          completed: false,
          createdAt: Date.now()
        };
        tasks.push(newTask);
        saveToStorage();
        render();
        taskInput.value = '';
        taskInput.focus();
      }

      function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveToStorage();
        render();
      }

      function toggleComplete(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
          task.completed = !task.completed;
          saveToStorage();
          render();
        }
      }

      function editTask(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        const newText = prompt('Edit task:', task.text);
        if (newText !== null && newText.trim() !== '') {
          task.text = newText.trim();
          saveToStorage();
          render();
        }
      }

      // ----- filter UI / change -----
      function setFilter(filter) {
        currentFilter = filter;
        filterBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.filter === filter);
        });
        render();
      }

      // ----- event listeners -----
      addBtn.addEventListener('click', () => {
        addTask(taskInput.value);
      });

      taskInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addTask(taskInput.value);
        }
      });

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const filter = btn.dataset.filter;
          setFilter(filter);
        });
      });

      // ----- init -----
      loadFromStorage();
      setFilter('all');
      render();

    })();
  </script>
</body>
</html>
