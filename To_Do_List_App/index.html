<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List App</title>
    <!-- Font Awesome (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="todo-card" id="app">
        <h1><i class="fas fa-list-check"></i> TODO LIST</h1>

        <!-- add task -->
        <div class="add-task">
            <input type="text" id="taskInput" placeholder="Add a new task …" />
            <button id="addBtn"><i class="fas fa-plus"></i> Add</button>
        </div>

        <!-- filter -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all"><i class="fas fa-list-ul"></i> All</button>
            <button class="filter-btn" data-filter="active"><i class="fas fa-circle"></i> Active</button>
            <button class="filter-btn" data-filter="completed"><i class="fas fa-check-circle"></i> Completed</button>
        </div>

        <!-- task list -->
        <ul class="task-list" id="taskList"></ul>

        <!-- features -->
        <div class="features">
            <span><i class="fas fa-pen-to-square"></i> Add/Edit/Delete</span>
            <span><i class="fas fa-check-double"></i> Mark Complete</span>
            <span><i class="fas fa-database"></i> Local Storage</span>
            <span><i class="fas fa-filter"></i> Filter Tasks</span>
            <span><i class="fas fa-mobile-screen"></i> Responsive UI</span>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
