<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator-card">
    <!-- header -->
    <div class="header">
      <h1>🧮 Calculator</h1>
      <div class="badge-group">
        <span class="badge live">● live</span>
      </div>
    </div>

    <!-- display -->
    <div class="display" id="display">
      <span class="memory-indicator" id="memoryIndicator">M</span>
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <!-- buttons -->
    <div class="buttons-grid">
      <!-- Row 1: Functions -->
      <button class="btn function" data-action="memory">M</button>
      <button class="btn function" data-action="memoryRecall">MR</button>
      <button class="btn function" data-action="memoryClear">MC</button>
      <button class="btn clear" data-action="clear">AC</button>

      <!-- Row 2 -->
      <button class="btn number" data-value="7">7</button>
      <button class="btn number" data-value="8">8</button>
      <button class="btn number" data-value="9">9</button>
      <button class="btn operator" data-operator="÷">÷</button>

      <!-- Row 3 -->
      <button class="btn number" data-value="4">4</button>
      <button class="btn number" data-value="5">5</button>
      <button class="btn number" data-value="6">6</button>
      <button class="btn operator" data-operator="×">×</button>

      <!-- Row 4 -->
      <button class="btn number" data-value="1">1</button>
      <button class="btn number" data-value="2">2</button>
      <button class="btn number" data-value="3">3</button>
      <button class="btn operator" data-operator="−">−</button>

      <!-- Row 5 -->
      <button class="btn number zero" data-value="0">0</button>
      <button class="btn number" data-value=".">.</button>
      <button class="btn operator" data-operator="+">+</button>
      <button class="btn equals" data-action="calculate">=</button>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
