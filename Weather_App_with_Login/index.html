<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Weather App · with Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- animated background orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <!-- main app -->
    <div class="app-wrapper">
        <header>
            <h1>🌤️ Weather</h1>
            <p class="subhead">with login &amp; favorites</p>
        </header>

        <!-- ===== LOGIN SECTION ===== -->
        <div id="loginSection" class="login-section">
            <div class="form-group">
                <label for="loginUser">Username</label>
                <input type="text" id="loginUser" placeholder="Enter username" />
            </div>
            <div class="form-group">
                <label for="loginPass">Password</label>
                <input type="password" id="loginPass" placeholder="Enter password" />
                <button type="button" class="password-toggle" id="togglePassword">👁️</button>
            </div>
            <button class="btn-primary" id="loginBtn">Sign In</button>
            <div class="auth-toggle">
                <span id="toggleText">Don't have an account?</span>
                <a id="toggleLink">Sign Up</a>
            </div>
            <div id="loginError" class="error-msg"></div>
            <div id="loginSuccess" class="success-msg"></div>
        </div>

        <!-- ===== WEATHER SECTION (hidden until login) ===== -->
        <div id="weatherSection" class="weather-section hidden">
            <!-- welcome + logout -->
            <div class="welcome-row">
                <span>👋 Welcome, <span id="displayUser" class="username">User</span>!</span>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>

            <!-- search -->
            <div class="search-row">
                <input type="text" id="cityInput" placeholder="Enter city name..." />
                <button id="searchBtn">🔍 Search</button>
            </div>

            <!-- weather display -->
            <div id="weatherDisplay" class="weather-card">
                <div style="color:rgba(255,255,255,0.3); font-size:0.95rem;">🌎 Search for a city to see weather</div>
            </div>

            <!-- save favorite -->
            <button id="saveFavBtn" class="save-fav-btn">
                ⭐ Save current city to favorites
            </button>

            <!-- favorites -->
            <div class="favorites-section">
                <h4>⭐ Your Favorite Cities</h4>
                <div id="favoritesContainer" class="favorites-grid">
                    <span class="empty-favs">No favorites yet</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
