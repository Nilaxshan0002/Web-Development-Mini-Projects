<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Weather App · with Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background: linear-gradient(145deg, #0b1a2e 0%, #1d3b5c 40%, #2a4f77 100%);
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* ----- animated background orbs ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: 0;
            animation: floatOrb 16s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb1 {
            width: 350px;
            height: 350px;
            background: #ff6b8a;
            top: -80px;
            left: -100px;
            animation-duration: 18s;
        }
        .orb2 {
            width: 400px;
            height: 400px;
            background: #6bcbff;
            bottom: -120px;
            right: -120px;
            animation-duration: 22s;
            animation-delay: -3s;
        }
        .orb3 {
            width: 280px;
            height: 280px;
            background: #b47aff;
            top: 40%;
            left: 60%;
            animation-duration: 20s;
            animation-delay: -7s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(60px, -40px) scale(1.1) rotate(5deg); }
            66% { transform: translate(-30px, 60px) scale(0.9) rotate(-5deg); }
            100% { transform: translate(40px, 20px) scale(1.05) rotate(3deg); }
        }

        /* ----- main glass container ----- */
        .app-wrapper {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.8rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* ----- header ----- */
        header {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f9e0a0 0%, #f5b8d0 50%, #b7d9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 6s infinite alternate;
        }
        @keyframes shimmer {
            0% { filter: brightness(0.9); }
            100% { filter: brightness(1.2); }
        }
        .subhead {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-top: 0.2rem;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ----- login form ----- */
        .login-section {
            transition: all 0.4s ease;
        }
        .login-section.hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 1rem;
            position: relative;
        }
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.2rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #f0f4fc;
            transition: 0.25s ease;
            outline: none;
        }
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .form-group input:focus {
            border-color: rgba(255, 215, 150, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(255, 215, 150, 0.08);
        }

        /* password toggle eye button */
        .password-toggle {
            position: absolute;
            right: 1rem;
            bottom: 0.8rem;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.2rem 0.4rem;
            transition: 0.2s ease;
            z-index: 3;
        }
        .password-toggle:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(145deg, #f5b06b, #f0906b);
            color: #0b1a2e;
            border: none;
            border-radius: 2.4rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(240, 144, 107, 0.25);
            letter-spacing: 0.3px;
            margin-top: 0.5rem;
        }
        .btn-primary:hover {
            transform: scale(0.97) translateY(-2px);
            box-shadow: 0 12px 28px rgba(240, 144, 107, 0.35);
            background: linear-gradient(145deg, #fcc084, #f09a6b);
        }
        .btn-primary:active {
            transform: scale(0.94);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 1rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }
        .auth-toggle a {
            color: #f5b06b;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .auth-toggle a:hover {
            color: #fcc084;
            text-decoration: underline;
        }

        .error-msg {
            color: #ff8a8a;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }
        .success-msg {
            color: #7ae0b0;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }

        /* ----- weather app (hidden by default) ----- */
        .weather-section {
            transition: all 0.4s ease;
        }
        .weather-section.hidden {
            display: none;
        }

        .welcome-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .welcome-row span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }
        .welcome-row .username {
            color: #f5e0c0;
            font-weight: 600;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: 0.2s ease;
        }
        .logout-btn:hover {
            background: rgba(255, 80, 80, 0.15);
            border-color: rgba(255, 80, 80, 0.2);
            color: #ffb3b3;
        }

        .search-row {
            display: flex;
            gap: 0.7rem;
            margin-bottom: 1.2rem;
        }
        .search-row input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.2rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #f0f4fc;
            transition: 0.25s ease;
            outline: none;
        }
        .search-row input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .search-row input:focus {
            border-color: rgba(255, 215, 150, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(255, 215, 150, 0.08);
        }
        .search-row button {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(145deg, #6bcbff, #4a9eff);
            color: #0b1a2e;
            border: none;
            border-radius: 2.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(74, 158, 255, 0.2);
            white-space: nowrap;
        }
        .search-row button:hover {
            transform: scale(0.97) translateY(-2px);
            box-shadow: 0 12px 28px rgba(74, 158, 255, 0.3);
            background: linear-gradient(145deg, #7dd4ff, #5aacff);
        }

        /* ----- weather display ----- */
        .weather-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 1.6rem;
            padding: 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 1.2rem;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .weather-card .city-name {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f5f0e8;
            margin-bottom: 0.2rem;
        }
        .weather-card .temp {
            font-size: 3rem;
            font-weight: 700;
            color: #f5e0c0;
            margin: 0.2rem 0;
        }
        .weather-card .desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            text-transform: capitalize;
        }
        .weather-card .details {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }
        .weather-card .details span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .weather-card .error-weather {
            color: #ff8a8a;
            font-size: 1rem;
        }

        /* ----- favorites ----- */
        .favorites-section {
            margin-top: 0.5rem;
        }
        .favorites-section h4 {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            margin-bottom: 0.6rem;
        }
        .favorites-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .fav-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .fav-chip:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 215, 150, 0.2);
            color: #f5e0c0;
            transform: translateY(-2px);
        }
        .fav-chip .remove-fav {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0 0.2rem;
            transition: 0.2s;
        }
        .fav-chip .remove-fav:hover {
            color: #ff8a8a;
        }
        .empty-favs {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            font-style: italic;
        }

        /* ----- responsive ----- */
        @media (max-width: 480px) {
            .app-wrapper { padding: 1.5rem; border-radius: 2rem; }
            header h1 { font-size: 1.8rem; }
            .search-row { flex-direction: column; }
            .search-row button { width: 100%; }
            .weather-card .temp { font-size: 2.4rem; }
            .orb { display: none; }
        }
    </style>
</head>
<body>

    <!-- animated background orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <!-- main app -->
    <div class="app-wrapper">
        <header>
            <h1>🌤️ Weather</h1>
            <p class="subhead">with login &amp; favorites</p>
        </header>

        <!-- ===== LOGIN SECTION ===== -->
        <div id="loginSection" class="login-section">
            <div class="form-group">
                <label for="loginUser">Username</label>
                <input type="text" id="loginUser" placeholder="Enter username" />
            </div>
            <div class="form-group">
                <label for="loginPass">Password</label>
                <input type="password" id="loginPass" placeholder="Enter password" />
                <button type="button" class="password-toggle" id="togglePassword">👁️</button>
            </div>
            <button class="btn-primary" id="loginBtn">Sign In</button>
            <div class="auth-toggle">
                <span id="toggleText">Don't have an account?</span>
                <a id="toggleLink">Sign Up</a>
            </div>
            <div id="loginError" class="error-msg"></div>
            <div id="loginSuccess" class="success-msg"></div>
        </div>

        <!-- ===== WEATHER SECTION (hidden until login) ===== -->
        <div id="weatherSection" class="weather-section hidden">
            <!-- welcome + logout -->
            <div class="welcome-row">
                <span>👋 Welcome, <span id="displayUser" class="username">User</span>!</span>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>

            <!-- search -->
            <div class="search-row">
                <input type="text" id="cityInput" placeholder="Enter city name..." />
                <button id="searchBtn">🔍 Search</button>
            </div>

            <!-- weather display -->
            <div id="weatherDisplay" class="weather-card">
                <div style="color:rgba(255,255,255,0.3); font-size:0.95rem;">🌎 Search for a city to see weather</div>
            </div>

            <!-- save favorite -->
            <button id="saveFavBtn" style="width:100%; padding:0.6rem; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:2rem; color:rgba(255,255,255,0.4); font-size:0.8rem; cursor:pointer; transition:0.2s; margin-bottom:1rem;">
                ⭐ Save current city to favorites
            </button>

            <!-- favorites -->
            <div class="favorites-section">
                <h4>⭐ Your Favorite Cities</h4>
                <div id="favoritesContainer" class="favorites-grid">
                    <span class="empty-favs">No favorites yet</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  WEATHER APP — full login, weather, favorites with localStorage
        // ============================================================

        // ---------- state ----------
        let currentUser = null;              // username string
        let currentCity = null;             // last searched city
        let weatherData = null;             // last weather data

        // ---------- DOM refs ----------
        const loginSection = document.getElementById('loginSection');
        const weatherSection = document.getElementById('weatherSection');

        const loginUser = document.getElementById('loginUser');
        const loginPass = document.getElementById('loginPass');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const loginSuccess = document.getElementById('loginSuccess');
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');
        const togglePassword = document.getElementById('togglePassword');

        const displayUser = document.getElementById('displayUser');
        const logoutBtn = document.getElementById('logoutBtn');

        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const weatherDisplay = document.getElementById('weatherDisplay');
        const saveFavBtn = document.getElementById('saveFavBtn');
        const favoritesContainer = document.getElementById('favoritesContainer');

        // ---------- password toggle ----------
        let passwordVisible = false;
        togglePassword.addEventListener('click', () => {
            passwordVisible = !passwordVisible;
            loginPass.type = passwordVisible ? 'text' : 'password';
            togglePassword.textContent = passwordVisible ? '🙈' : '👁️';
        });

        // ---------- helpers ----------
        function getUsers() {
            try {
                return JSON.parse(localStorage.getItem('weather_users')) || {};
            } catch { return {}; }
        }

        function saveUsers(users) {
            localStorage.setItem('weather_users', JSON.stringify(users));
        }

        function getFavorites(username) {
            try {
                const all = JSON.parse(localStorage.getItem('weather_favorites')) || {};
                return all[username] || [];
            } catch { return []; }
        }

        function saveFavorites(username, favs) {
            const all = JSON.parse(localStorage.getItem('weather_favorites')) || {};
            all[username] = favs;
            localStorage.setItem('weather_favorites', JSON.stringify(all));
        }

        // ---------- render favorites ----------
        function renderFavorites() {
            if (!currentUser) return;
            const favs = getFavorites(currentUser);
            if (!favs.length) {
                favoritesContainer.innerHTML = '<span class="empty-favs">No favorites yet</span>';
                return;
            }
            favoritesContainer.innerHTML = favs.map(city => `
                <div class="fav-chip" data-city="${city}">
                    ⭐ ${city}
                    <button class="remove-fav" data-city="${city}">✕</button>
                </div>
            `).join('');

            // click on chip → search that city
            favoritesContainer.querySelectorAll('.fav-chip').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    if (e.target.classList.contains('remove-fav')) return;
                    const city = chip.dataset.city;
                    cityInput.value = city;
                    fetchWeather(city);
                });
            });

            // remove favorite
            favoritesContainer.querySelectorAll('.remove-fav').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const city = btn.dataset.city;
                    let favs = getFavorites(currentUser);
                    favs = favs.filter(c => c.toLowerCase() !== city.toLowerCase());
                    saveFavorites(currentUser, favs);
                    renderFavorites();
                });
            });
        }

        // ---------- fetch weather from OpenWeatherMap ----------
        const API_KEY = 'bd5e378503939ddaee76f12ad7a97608'; // demo key

        async function fetchWeather(city) {
            if (!city) {
                weatherDisplay.innerHTML = `<div style="color:rgba(255,255,255,0.3); font-size:0.95rem;">Please enter a city name</div>`;
                return;
            }

            weatherDisplay.innerHTML = `<div style="color:rgba(255,255,255,0.3);">⏳ Loading...</div>`;

            try {
                const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=metric&appid=${API_KEY}`;
                const response = await fetch(url);
                if (!response.ok) {
                    if (response.status === 404) throw new Error('City not found');
                    throw new Error('Failed to fetch weather');
                }
                const data = await response.json();

                weatherData = data;
                currentCity = data.name;

                weatherDisplay.innerHTML = `
                    <div class="city-name">${data.name}, ${data.sys.country}</div>
                    <div class="temp">${Math.round(data.main.temp)}°C</div>
                    <div class="desc">${data.weather[0].description}</div>
                    <div class="details">
                        <span>💧 ${data.main.humidity}%</span>
                        <span>💨 ${Math.round(data.wind.speed)} m/s</span>
                        <span>🌡️ ${Math.round(data.main.temp_min)}° / ${Math.round(data.main.temp_max)}°</span>
                    </div>
                `;
            } catch (err) {
                weatherDisplay.innerHTML = `
                    <div class="error-weather">❌ ${err.message}</div>
                `;
                weatherData = null;
                currentCity = null;
            }
        }

        // ---------- save favorite ----------
        function saveFavorite() {
            if (!currentUser) return;
            if (!currentCity) {
                alert('Please search for a city first.');
                return;
            }
            const favs = getFavorites(currentUser);
            if (favs.some(c => c.toLowerCase() === currentCity.toLowerCase())) {
                alert(`${currentCity} is already in your favorites!`);
                return;
            }
            favs.push(currentCity);
            saveFavorites(currentUser, favs);
            renderFavorites();
        }

        // ---------- login / signup ----------
        let isLoginMode = true;

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            loginBtn.textContent = isLoginMode ? 'Sign In' : 'Create Account';
            toggleText.textContent = isLoginMode ? "Don't have an account?" : "Already have an account?";
            toggleLink.textContent = isLoginMode ? 'Sign Up' : 'Sign In';
            loginError.textContent = '';
            loginSuccess.textContent = '';
        }

        function handleAuth() {
            const user = loginUser.value.trim();
            const pass = loginPass.value.trim();

            // Clear previous messages
            loginError.textContent = '';
            loginSuccess.textContent = '';

            if (!user || !pass) {
                loginError.textContent = 'Please fill in all fields.';
                return;
            }

            const users = getUsers();

            if (isLoginMode) {
                // LOGIN
                if (users[user] && users[user] === pass) {
                    loginSuccess.textContent = '✅ Login successful!';
                    setTimeout(() => {
                        currentUser = user;
                        showWeatherApp();
                    }, 500);
                } else {
                    loginError.textContent = '❌ Invalid username or password.';
                }
            } else {
                // SIGNUP
                if (users[user]) {
                    loginError.textContent = '❌ Username already exists.';
                    return;
                }
                users[user] = pass;
                saveUsers(users);
                loginSuccess.textContent = '✅ Account created successfully! Please sign in.';
                // Clear fields and switch to login mode
                loginUser.value = '';
                loginPass.value = '';
                setTimeout(() => {
                    if (!isLoginMode) toggleAuthMode();
                }, 1000);
            }
        }

        function showWeatherApp() {
            loginSection.classList.add('hidden');
            weatherSection.classList.remove('hidden');
            displayUser.textContent = currentUser;
            renderFavorites();
            weatherDisplay.innerHTML = `<div style="color:rgba(255,255,255,0.3); font-size:0.95rem;">🌎 Search for a city to see weather</div>`;
            currentCity = null;
            weatherData = null;
        }

        function logout() {
            currentUser = null;
            weatherSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            loginUser.value = '';
            loginPass.value = '';
            loginError.textContent = '';
            loginSuccess.textContent = '';
            weatherDisplay.innerHTML = `<div style="color:rgba(255,255,255,0.3); font-size:0.95rem;">🌎 Search for a city to see weather</div>`;
        }

        // ---------- event listeners ----------
        loginBtn.addEventListener('click', handleAuth);

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleAuthMode();
        });

        loginUser.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuth(); });
        loginPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuth(); });

        logoutBtn.addEventListener('click', logout);

        searchBtn.addEventListener('click', () => {
            const city = cityInput.value.trim();
            if (city) fetchWeather(city);
        });

        cityInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const city = cityInput.value.trim();
                if (city) fetchWeather(city);
            }
        });

        saveFavBtn.addEventListener('click', saveFavorite);

        // ---------- init ----------
        console.log('🌤️ Weather App ready — login to start.');
    </script>

</body>
