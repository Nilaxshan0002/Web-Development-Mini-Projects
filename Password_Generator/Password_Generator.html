<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 30% 10%, #0f1428, #05060d 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.8rem;
    }

    .generator-card {
      max-width: 480px;
      width: 100%;
      background: rgba(18, 22, 42, 0.85);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border-radius: 3.6rem;
      padding: 2.8rem 2.4rem 2.8rem;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .generator-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(75, 124, 247, 0.06), transparent 60%);
      pointer-events: none;
    }

    /* ----- header ----- */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f0f4ff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .badge-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(75, 124, 247, 0.12);
      color: #7a9cff;
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      padding: 0.2rem 0.8rem;
      border-radius: 60px;
      text-transform: uppercase;
      border: 1px solid rgba(75, 124, 247, 0.12);
      backdrop-filter: blur(2px);
    }

    .badge.live {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.15);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .subhead {
      color: #8d9bc9;
      font-size: 0.8rem;
      font-weight: 400;
      border-left: 3px solid #4b7cf7;
      padding-left: 1rem;
      margin: 0.3rem 0 1.8rem 0;
      background: rgba(75, 124, 247, 0.04);
      border-radius: 0 12px 12px 0;
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }

    /* ----- password display ----- */
    .password-display {
      position: relative;
      z-index: 1;
      margin-bottom: 1.8rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 1.5rem;
      padding: 0.8rem 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 70px;
      transition: all 0.3s ease;
    }

    .password-display .password-text {
      color: #f0f4ff;
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      word-break: break-all;
      flex: 1;
      font-family: 'Courier New', monospace;
      transition: all 0.3s ease;
    }

    .password-display .password-text.placeholder {
      color: #4a5a7a;
      font-weight: 300;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    .password-display .copy-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #6a7aa8;
      padding: 0.5rem 0.8rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .password-display .copy-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #4b5a85;
      color: #b3c4f0;
    }

    .password-display .copy-btn:active {
      transform: scale(0.94);
    }

    .password-display .copy-btn.copied {
      border-color: #4ade80;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.1);
    }

    .password-display .strength-indicator {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 0 0 1.5rem 1.5rem;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
    }

    .password-display .strength-bar {
      height: 100%;
      width: 0%;
      transition: width 0.5s ease, background 0.5s ease;
      border-radius: 0 0 1.5rem 1.5rem;
    }

    /* ----- options ----- */
    .options {
      position: relative;
      z-index: 1;
      margin-bottom: 1.8rem;
    }

    .option-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .option-group:last-child {
      border-bottom: none;
    }

    .option-label {
      color: #b3c4f0;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .option-label .hint {
      color: #5a6a94;
      font-size: 0.75rem;
      margin-left: 0.3rem;
    }

    /* Custom checkbox */
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .checkbox-wrapper input[type="checkbox"] {
      display: none;
    }

    .checkbox-wrapper .checkmark {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #2a3150;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .checkbox-wrapper input:checked + .checkmark {
      background: #4b7cf7;
      border-color: #4b7cf7;
    }

    .checkbox-wrapper input:checked + .checkmark::after {
      content: '✓';
      color: white;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .checkbox-wrapper:hover .checkmark {
      border-color: #4b5a85;
    }

    /* Length slider */
    .length-control {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .length-control input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 140px;
      height: 4px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      outline: none;
      transition: all 0.2s ease;
    }

    .length-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(145deg, #4b7cf7, #3a65d9);
      cursor: pointer;
      box-shadow: 0 0 20px rgba(75, 124, 247, 0.3);
      transition: all 0.2s ease;
    }

    .length-control input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    .length-control input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(145deg, #4b7cf7, #3a65d9);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 20px rgba(75, 124, 247, 0.3);
    }

    .length-value {
      color: #f0f4ff;
      font-size: 1.1rem;
      font-weight: 600;
      min-width: 32px;
      text-align: center;
    }

    /* ----- generate button ----- */
    .generate-btn {
      width: 100%;
      background: linear-gradient(145deg, #4b7cf7, #3a65d9);
      border: none;
      padding: 0.9rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 6px 24px rgba(75, 124, 247, 0.3);
      letter-spacing: 0.4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      position: relative;
      z-index: 1;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(75, 124, 247, 0.45);
      background: linear-gradient(145deg, #5a87ff, #3f6be0);
    }

    .generate-btn:active {
      transform: scale(0.97);
    }

    /* ----- toast ----- */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(18, 22, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      border: 1px solid rgba(75, 124, 247, 0.2);
      color: #b3c4f0;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ----- responsive ----- */
    @media (max-width: 500px) {
      .generator-card {
        padding: 2rem 1.5rem 2rem;
        border-radius: 2.4rem;
      }
      h1 {
        font-size: 1.3rem;
      }
      .password-display .password-text {
        font-size: 1rem;
      }
      .length-control input[type="range"] {
        width: 100px;
      }
    }

    @media (max-width: 400px) {
      .generator-card {
        padding: 1.5rem 1rem 1.5rem;
        border-radius: 2rem;
      }
      .password-display {
        flex-direction: column;
        align-items: stretch;
        gap: 0.6rem;
      }
      .password-display .copy-btn {
        justify-content: center;
      }
      .option-group {
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .length-control {
        width: 100%;
        justify-content: space-between;
      }
      .length-control input[type="range"] {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="generator-card">
    <!-- header -->
    <div class="header">
      <h1>🔐 Password</h1>
      <div class="badge-group">
        <span class="badge live">● live</span>
      </div>
    </div>
    <div class="subhead">
      Generate strong, secure passwords with custom options.
    </div>

    <!-- password display -->
    <div class="password-display" id="passwordDisplay">
      <span class="password-text placeholder" id="passwordText">Click generate to create a password</span>
      <button class="copy-btn" id="copyBtn">📋 Copy</button>
      <div class="strength-indicator">
        <div class="strength-bar" id="strengthBar"></div>
      </div>
    </div>

    <!-- options -->
    <div class="options">
      <!-- Length -->
      <div class="option-group">
        <span class="option-label">Length</span>
        <div class="length-control">
          <input type="range" id="lengthSlider" min="4" max="32" value="16" />
          <span class="length-value" id="lengthValue">16</span>
        </div>
      </div>

      <!-- Uppercase -->
      <div class="option-group">
        <span class="option-label">Uppercase <span class="hint">(A-Z)</span></span>
        <label class="checkbox-wrapper">
          <input type="checkbox" id="uppercase" checked />
          <span class="checkmark"></span>
        </label>
      </div>

      <!-- Lowercase -->
      <div class="option-group">
        <span class="option-label">Lowercase <span class="hint">(a-z)</span></span>
        <label class="checkbox-wrapper">
          <input type="checkbox" id="lowercase" checked />
          <span class="checkmark"></span>
        </label>
      </div>

      <!-- Numbers -->
      <div class="option-group">
        <span class="option-label">Numbers <span class="hint">(0-9)</span></span>
        <label class="checkbox-wrapper">
          <input type="checkbox" id="numbers" checked />
          <span class="checkmark"></span>
        </label>
      </div>

      <!-- Symbols -->
      <div class="option-group">
        <span class="option-label">Symbols <span class="hint">(!@#$%^&*)</span></span>
        <label class="checkbox-wrapper">
          <input type="checkbox" id="symbols" checked />
          <span class="checkmark"></span>
        </label>
      </div>
    </div>

    <!-- generate button -->
    <button class="generate-btn" id="generateBtn">
      <span>⚡</span> Generate Password
    </button>
  </div>

  <!-- toast -->
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      "use strict";

      // ----- DOM refs -----
      const passwordText = document.getElementById('passwordText');
      const copyBtn = document.getElementById('copyBtn');
      const generateBtn = document.getElementById('generateBtn');
      const lengthSlider = document.getElementById('lengthSlider');
      const lengthValue = document.getElementById('lengthValue');
      const uppercaseCheck = document.getElementById('uppercase');
      const lowercaseCheck = document.getElementById('lowercase');
      const numbersCheck = document.getElementById('numbers');
      const symbolsCheck = document.getElementById('symbols');
      const strengthBar = document.getElementById('strengthBar');
      const toast = document.getElementById('toast');

      // ----- state -----
      let currentPassword = '';

      // ----- character sets -----
      const UPPERCASE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const LOWERCASE = 'abcdefghijklmnopqrstuvwxyz';
      const NUMBERS = '0123456789';
      const SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';

      // ----- helpers -----
      function shuffleString(str) {
        const arr = str.split('');
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr.join('');
      }

      function getCharacterSet() {
        let chars = '';
        if (uppercaseCheck.checked) chars += UPPERCASE;
        if (lowercaseCheck.checked) chars += LOWERCASE;
        if (numbersCheck.checked) chars += NUMBERS;
        if (symbolsCheck.checked) chars += SYMBOLS;
        return chars;
      }

      function getStrength(password) {
        let score = 0;
        const length = password.length;
        
        // Length score
        if (length >= 8) score += 1;
        if (length >= 12) score += 1;
        if (length >= 16) score += 1;
        
        // Character variety
        if (/[A-Z]/.test(password)) score += 1;
        if (/[a-z]/.test(password)) score += 1;
        if (/[0-9]/.test(password)) score += 1;
        if (/[^A-Za-z0-9]/.test(password)) score += 1;
        
        return Math.min(score, 5);
      }

      function getStrengthColor(score) {
        const colors = [
          '#f87171', // 0 - Very Weak
          '#fb923c', // 1 - Weak
          '#fbbf24', // 2 - Fair
          '#4ade80', // 3 - Good
          '#34d399', // 4 - Strong
          '#22d3ee'  // 5 - Very Strong
        ];
        return colors[score] || colors[0];
      }

      function getStrengthLabel(score) {
        const labels = [
          'Very Weak',
          'Weak',
          'Fair',
          'Good',
          'Strong',
          'Very Strong'
        ];
        return labels[score] || 'Unknown';
      }

      // ----- generate password -----
      function generatePassword() {
        const length = parseInt(lengthSlider.value);
        const chars = getCharacterSet();
        
        if (!chars) {
          passwordText.textContent = 'Select at least one option!';
          passwordText.className = 'password-text';
          strengthBar.style.width = '0%';
          return '';
        }

        // Ensure at least one character from each selected set
        let password = '';
        const sets = [];
        if (uppercaseCheck.checked) sets.push(UPPERCASE);
        if (lowercaseCheck.checked) sets.push(LOWERCASE);
        if (numbersCheck.checked) sets.push(NUMBERS);
        if (symbolsCheck.checked) sets.push(SYMBOLS);

        // Add one character from each selected set
        for (const set of sets) {
          password += set[Math.floor(Math.random() * set.length)];
        }

        // Fill the rest with random characters
        for (let i = password.length; i < length; i++) {
          password += chars[Math.floor(Math.random() * chars.length)];
        }

        // Shuffle the password
        password = shuffleString(password);
        
        return password;
      }

      // ----- update password display -----
      function updatePassword() {
        const password = generatePassword();
        if (password) {
          currentPassword = password;
          passwordText.textContent = password;
          passwordText.className = 'password-text';
          
          // Update strength
          const strength = getStrength(password);
          const percentage = (strength / 5) * 100;
          strengthBar.style.width = `${percentage}%`;
          strengthBar.style.background = getStrengthColor(strength);
          
          // Update copy button
          copyBtn.textContent = '📋 Copy';
          copyBtn.classList.remove('copied');
        }
      }

      // ----- copy password -----
      function copyPassword() {
        if (!currentPassword) {
          showToast('⚠️ Generate a password first!');
          return;
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(currentPassword).then(() => {
            showToast('✅ Password copied!');
            copyBtn.textContent = '✅ Copied!';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.textContent = '📋 Copy';
              copyBtn.classList.remove('copied');
            }, 2000);
          }).catch(() => {
            fallbackCopy();
          });
        } else {
          fallbackCopy();
        }
      }

      function fallbackCopy() {
        const textarea = document.createElement('textarea');
        textarea.value = currentPassword;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('✅ Password copied!');
          copyBtn.textContent = '✅ Copied!';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = '📋 Copy';
            copyBtn.classList.remove('copied');
          }, 2000);
        } catch (err) {
          showToast('❌ Failed to copy');
        }
        document.body.removeChild(textarea);
      }

      // ----- toast -----
      let toastTimeout = null;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      }

      // ----- event listeners -----
      generateBtn.addEventListener('click', updatePassword);
      
      copyBtn.addEventListener('click', copyPassword);

      lengthSlider.addEventListener('input', () => {
        lengthValue.textContent = lengthSlider.value;
        updatePassword();
      });

      // Update password when checkboxes change
      [uppercaseCheck, lowercaseCheck, numbersCheck, symbolsCheck].forEach(checkbox => {
        checkbox.addEventListener('change', updatePassword);
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          if (e.target === document.body) {
            e.preventDefault();
            updatePassword();
          }
        }
        if ((e.key === 'c' || e.key === 'C') && !e.ctrlKey && !e.metaKey) {
          if (e.target === document.body) {
            e.preventDefault();
            copyPassword();
          }
        }
        if (e.key === 'Enter' && e.target.tagName !== 'INPUT') {
          updatePassword();
        }
      });

      // ----- init -----
      updatePassword();

      console.log('✅ Password Generator');
      console.log('   ⌨️  Space = generate  |  c = copy  |  Enter = generate');
      console.log('   🔐 Generating secure passwords with custom options');

    })();
  </script>
</body>
</html>
