<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional StopWatch | Precision Timer</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stopwatch-card" id="appContainer">
        <!-- Brand -->
        <div class="brand">
            <span class="brand-icon">⏱️</span>
            <h1>StopWatch</h1>
        </div>

        <!-- Timer Display -->
        <div class="timer-display" id="timerDisplay">
            <span id="timer">
                <span id="minutes">00</span>:<span id="seconds">00</span>.<span id="milliseconds" class="milli">00</span>
            </span>
        </div>

        <!-- Control Buttons -->
        <div class="controls">
            <button class="btn btn-success" id="startBtn" aria-label="Start">▶ Start</button>
            <button class="btn btn-primary" id="pauseBtn" aria-label="Pause" disabled>⏸️ Pause</button>
            <button class="btn btn-danger" id="resetBtn" aria-label="Reset">⟲ Reset</button>
        </div>

        <!-- Lap & split area -->
        <div class="lap-section">
            <div class="lap-header">
                <span>📋 Laps</span>
                <span id="lapCount">0</span>
            </div>

            <!-- Lap list container -->
            <div id="lapList">
                <div class="empty-lap-message">No laps recorded</div>
            </div>

            <!-- extra actions: lap + clear -->
            <div style="display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; margin-top: 0.8rem;">
                <button class="btn btn-outline" id="lapBtn" style="flex: 1; min-width: 100px;">⏺️ Lap</button>
                <button class="clear-lap-btn" id="clearLapsBtn">🗑️ Clear laps</button>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
