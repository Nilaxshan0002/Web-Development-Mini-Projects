<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes · professional</title>
  <!-- Font Awesome (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- external CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- header -->
    <div class="app-header">
      <div class="logo-area">
        <i class="fas fa-pencil-alt"></i>
        <h1>Notes</h1>
      </div>
      <span class="note-count" id="noteCounter">0 notes</span>
    </div>

    <!-- search + add -->
    <div class="search-add">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search notes..." />
      <button class="btn-primary" id="addNoteBtn"><i class="fas fa-plus"></i> Add</button>
    </div>

    <!-- notes grid -->
    <div class="notes-grid" id="notesGrid">
      <!-- dynamic cards will be injected here -->
    </div>
  </div>

  <!-- modal overlay (add / edit) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2 id="modalTitle">✏️ New Note</h2>
      <p class="sub" id="modalSub">Add a title and some content.</p>
      <label for="noteTitleInput">Title</label>
      <input type="text" id="noteTitleInput" placeholder="Note title..." />
      <label for="noteContentInput">Content</label>
      <textarea id="noteContentInput" placeholder="Write something..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="modalCancelBtn">Cancel</button>
        <button class="btn-primary-outline" id="modalSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- external JavaScript -->
  <script src="script.js"></script>
</body>
</html>
