<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat · Application</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-app" id="app">

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- header -->
    <div class="chat-header">
        <div class="avatar">
            <i class="fas fa-comment-dots" style="font-size: 1.3rem;"></i>
        </div>
        <div class="info">
            <h2>Chat Application</h2>
            <p><i class="fas fa-circle"></i> live · 2 participants</p>
        </div>
        <div class="header-actions">
            <span class="action-btn" id="callBtn"><i class="fas fa-phone-alt"></i></span>
            <span class="action-btn" id="videoBtn"><i class="fas fa-video"></i></span>
            <span class="action-btn" id="menuToggle"><i class="fas fa-ellipsis-v"></i></span>
        </div>
    </div>

    <!-- dropdown menu -->
    <div class="dropdown-menu" id="dropdownMenu">
        <button class="dropdown-item" data-action="profile"><i class="fas fa-user-circle"></i> Profile</button>
        <button class="dropdown-item" data-action="settings"><i class="fas fa-cog"></i> Settings</button>
        <button class="dropdown-item" data-action="theme"><i class="fas fa-palette"></i> Theme</button>
        <div class="divider"></div>
        <button class="dropdown-item" data-action="archive"><i class="fas fa-archive"></i> Archive</button>
        <button class="dropdown-item danger" data-action="clear"><i class="fas fa-trash-alt"></i> Clear chat</button>
    </div>

    <!-- messages -->
    <div class="messages-container" id="messageContainer">
        <div class="typing-indicator" id="typingIndicator">
            <i class="fas fa-circle"></i> <i class="fas fa-circle"></i> <i class="fas fa-circle"></i> 
            <span style="margin-left: 6px;">Alice is typing ...</span>
        </div>
    </div>

    <!-- input -->
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type a message ..." autocomplete="off">
        <button id="sendBtn" aria-label="Send message">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
