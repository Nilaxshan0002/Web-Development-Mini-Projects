<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EventHub Pro · Booking System</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-wrapper">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo"><i class="fas fa-calendar-alt"></i> EventHub</div>
            <div class="header-actions">
                <button class="icon-btn" id="notificationBtn" aria-label="notifications">
                    <i class="far fa-bell"></i>
                    <span class="badge" id="notificationBadge">3</span>
                </button>
                <button class="icon-btn" id="helpBtn" aria-label="help">
                    <i class="far fa-question-circle"></i>
                </button>
                <div class="profile-section" id="profileSection">
                    <div class="avatar">JD</div>
                    <div class="profile-name">
                        James Davis
                        <span>Admin</span>
                    </div>
                    <i class="fas fa-chevron-down" style="font-size:0.7rem; color:#6b7f9e;"></i>
                    <div class="profile-dropdown" id="profileDropdown">
                        <a href="#" id="profileLink"><i class="fas fa-user"></i> My Profile</a>
                        <a href="#" id="myEventsLink"><i class="fas fa-calendar-alt"></i> My Events</a>
                        <a href="#" id="myBookingsLink"><i class="fas fa-ticket-alt"></i> My Bookings</a>
                        <a href="#" id="settingsLink"><i class="fas fa-cog"></i> Settings</a>
                        <div class="divider"></div>
                        <a href="#" id="logoutLink" style="color:#f25a6a;"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- ===== TABS ===== -->
        <div class="tabs">
            <button class="active" data-tab="events"><i class="fas fa-calendar-day"></i> Events</button>
            <button data-tab="bookings"><i class="fas fa-ticket-alt"></i> My Bookings</button>
        </div>

        <!-- ===== EVENTS SECTION ===== -->
        <div id="eventsSection">
            <div class="event-grid" id="eventGrid">
                <!-- injected by JS -->
            </div>
        </div>

        <!-- ===== BOOKINGS SECTION ===== -->
        <div id="bookingsSection" class="bookings-section">
            <div id="bookingsList">
                <!-- injected by JS -->
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <span>© 2026 EventHub · Book with confidence</span>
            <div class="footer-links">
                <a id="helpLink">Help</a>
                <a id="privacyLink">Privacy</a>
                <a id="termsLink">Terms</a>
            </div>
        </footer>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Book Event</h3>
                <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody">
                <!-- dynamic content -->
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
