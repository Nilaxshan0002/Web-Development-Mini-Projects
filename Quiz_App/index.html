<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz · professional</title>
  <!-- Font Awesome (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- external CSS - make sure style.css is in the same folder -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container" id="app">
    <!-- header -->
    <div class="quiz-header">
      <div class="logo-area">
        <i class="fas fa-brain"></i>
        <h1>Quiz</h1>
      </div>
      <div class="score-badge">
        <i class="fas fa-star"></i>
        <span id="scoreDisplay">0</span>
      </div>
    </div>

    <!-- progress -->
    <div class="progress-wrapper">
      <div class="progress-info">
        <span id="progressText">Question 1 of 10</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- main content: question / result -->
    <div id="questionScreen">
      <div class="question-area">
        <div class="question-number" id="qNumber">QUESTION 1</div>
        <div class="question-text" id="qText">Loading question...</div>
        <div class="question-category" id="qCategory">General</div>
      </div>

      <div class="options-list" id="optionsContainer">
        <!-- options injected by JS -->
      </div>

      <div class="feedback-area">
        <div class="feedback-message" id="feedbackMsg">
          <i class="fas fa-info-circle"></i>
          <span>Select an option</span>
        </div>
        <button class="btn-next" id="nextBtn" disabled>Next <i class="fas fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- result screen (hidden by default) -->
    <div id="resultScreen" class="result-screen hidden">
      <div class="big-icon"><i class="fas fa-trophy"></i></div>
      <h2>Quiz Complete!</h2>
      <p class="sub">Here's how you performed</p>
      <div class="result-score" id="finalScore">0 / 0</div>
      <p class="result-detail" id="resultDetail">Great effort!</p>
      <div class="result-actions">
        <button class="btn-restart" id="restartBtn"><i class="fas fa-redo"></i> Retry</button>
      </div>
    </div>
  </div>

  <!-- external JavaScript - make sure script.js is in the same folder -->
  <script src="script.js"></script>
</body>
</html>
