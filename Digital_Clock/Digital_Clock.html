<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Clock</title>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 30% 10%, #0f1428, #05060d 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.8rem;
    }

    .clock-card {
      max-width: 720px;
      width: 100%;
      background: rgba(18, 22, 42, 0.8);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border-radius: 3.6rem;
      padding: 3rem 2.8rem 3.2rem;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* subtle glow */
    .clock-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(75, 124, 247, 0.06), transparent 60%);
      pointer-events: none;
    }

    /* ----- header ----- */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f0f4ff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .badge-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(75, 124, 247, 0.12);
      color: #7a9cff;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      padding: 0.25rem 0.9rem;
      border-radius: 60px;
      text-transform: uppercase;
      border: 1px solid rgba(75, 124, 247, 0.12);
      backdrop-filter: blur(2px);
    }

    .badge.live {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.15);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .subhead {
      color: #8d9bc9;
      font-size: 0.85rem;
      font-weight: 400;
      border-left: 3px solid #4b7cf7;
      padding-left: 1rem;
      margin: 0.3rem 0 2rem 0;
      background: rgba(75, 124, 247, 0.04);
      border-radius: 0 12px 12px 0;
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }

    /* ----- clock display ----- */
    .clock-display {
      text-align: center;
      padding: 1.2rem 0 0.8rem;
      position: relative;
      z-index: 1;
    }

    .time-main {
      font-size: 5.5rem;
      font-weight: 700;
      color: #f2f7ff;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 30px rgba(75, 124, 247, 0.15);
      line-height: 1.1;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .time-main .seconds {
      font-size: 2.8rem;
      font-weight: 400;
      color: #7a8fc9;
      letter-spacing: 0.02em;
    }

    .time-main .separator {
      color: #4b7cf7;
      font-weight: 300;
      opacity: 0.6;
      margin: 0 0.1rem;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.2; }
    }

    .date-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 0.8rem;
      font-size: 1.1rem;
      color: #8d9bc9;
      letter-spacing: 0.3px;
      flex-wrap: wrap;
    }

    .date-display .date-text {
      font-weight: 500;
      color: #b3c4f0;
    }

    .date-display .day-text {
      background: rgba(255, 255, 255, 0.04);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      font-weight: 500;
      color: #7a9cff;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.8px;
    }

    /* ----- timezone / format controls ----- */
    .clock-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.2rem 2rem;
      margin-top: 1.8rem;
      padding-top: 1.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      position: relative;
      z-index: 1;
    }

    .format-toggle {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.25rem 0.4rem;
      border-radius: 60px;
      border: 1px solid #2a3150;
    }

    .format-toggle button {
      background: transparent;
      border: none;
      color: #6a7aa8;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.3px;
    }

    .format-toggle button.active {
      background: rgba(75, 124, 247, 0.2);
      color: #b3c4f0;
      box-shadow: 0 0 20px rgba(75, 124, 247, 0.05);
    }

    .format-toggle button:hover:not(.active) {
      color: #b3c4f0;
    }

    .timezone-info {
      color: #5a6a94;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .timezone-info span {
      color: #7a8fc9;
      font-weight: 500;
    }

    /* ----- footer ----- */
    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      position: relative;
      z-index: 1;
    }

    .status-text {
      color: #5a6a94;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .status-text .highlight {
      color: #7a9cff;
    }

    .action-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #2a3150;
      color: #6a7aa8;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: #4b5a85;
      color: #b3c4f0;
    }

    .btn-icon:active {
      transform: scale(0.94);
    }

    /* ----- responsive ----- */
    @media (max-width: 650px) {
      .clock-card {
        padding: 2rem 1.5rem 2.2rem;
        border-radius: 2.4rem;
      }
      .time-main {
        font-size: 3.8rem;
      }
      .time-main .seconds {
        font-size: 2rem;
      }
      .date-display {
        font-size: 0.95rem;
        gap: 0.8rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .clock-controls {
        flex-direction: column;
        gap: 1rem;
      }
      .footer {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }

    @media (max-width: 420px) {
      .clock-card {
        padding: 1.5rem 1rem 1.8rem;
        border-radius: 2rem;
      }
      .time-main {
        font-size: 2.8rem;
      }
      .time-main .seconds {
        font-size: 1.5rem;
      }
      .date-display {
        font-size: 0.8rem;
      }
      .format-toggle button {
        padding: 0.3rem 0.9rem;
        font-size: 0.65rem;
      }
      .subhead {
        font-size: 0.75rem;
        padding-left: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="clock-card">
    <!-- header -->
    <div class="header">
      <h1>🕐 Digital Clock</h1>
      <div class="badge-group">
        <span class="badge live">● live</span>
      </div>
    </div>
    <div class="subhead">
      A clean, real-time digital clock with date &amp; format controls.
    </div>

    <!-- clock display -->
    <div class="clock-display">
      <div class="time-main" id="timeDisplay">
        <span id="hours">00</span>
        <span class="separator">:</span>
        <span id="minutes">00</span>
        <span class="separator">:</span>
        <span class="seconds" id="seconds">00</span>
        <span id="ampm" style="font-size:1.2rem;font-weight:400;color:#7a8fc9;margin-left:0.2rem;"></span>
      </div>
      <div class="date-display">
        <span class="date-text" id="dateDisplay">January 1, 2026</span>
        <span class="day-text" id="dayDisplay">MON</span>
      </div>
    </div>

    <!-- controls -->
    <div class="clock-controls">
      <div class="format-toggle" id="formatToggle">
        <button class="active" data-format="12">12h</button>
        <button data-format="24">24h</button>
      </div>
      <div class="timezone-info">
        ⏳ <span id="timezone">UTC</span>
      </div>
    </div>

    <!-- footer -->
    <div class="footer">
      <div class="status-text">
        <span class="highlight">●</span> updating every second
      </div>
      <div class="action-group">
        <button class="btn-icon" id="refreshBtn">⟳ Refresh</button>
        <button class="btn-icon" id="fullscreenBtn">⛶ Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ----- DOM refs -----
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');
      const ampmEl = document.getElementById('ampm');
      const dateDisplay = document.getElementById('dateDisplay');
      const dayDisplay = document.getElementById('dayDisplay');
      const timezoneEl = document.getElementById('timezone');
      const formatButtons = document.querySelectorAll('.format-toggle button');
      const refreshBtn = document.getElementById('refreshBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');

      // ----- state -----
      let currentFormat = '12'; // '12' or '24'
      let clockInterval = null;

      // ----- helpers -----
      function padZero(num) {
        return String(num).padStart(2, '0');
      }

      function getDayName(dayIndex) {
        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        return days[dayIndex];
      }

      function getMonthName(monthIndex) {
        const months = ['January', 'February', 'March', 'April', 'May', 'June',
                        'July', 'August', 'September', 'October', 'November', 'December'];
        return months[monthIndex];
      }

      function getOrdinalSuffix(day) {
        if (day >= 11 && day <= 13) return 'th';
        const lastDigit = day % 10;
        if (lastDigit === 1) return 'st';
        if (lastDigit === 2) return 'nd';
        if (lastDigit === 3) return 'rd';
        return 'th';
      }

      // ----- update clock -----
      function updateClock() {
        const now = new Date();

        // Time
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();
        let ampm = '';

        if (currentFormat === '12') {
          ampm = hours >= 12 ? 'PM' : 'AM';
          hours = hours % 12 || 12;
        }

        hoursEl.textContent = padZero(hours);
        minutesEl.textContent = padZero(minutes);
        secondsEl.textContent = padZero(seconds);
        ampmEl.textContent = currentFormat === '12' ? ampm : '';

        // Date
        const year = now.getFullYear();
        const month = now.getMonth();
        const day = now.getDate();
        const dayName = getDayName(now.getDay());

        const ordinal = getOrdinalSuffix(day);
        dateDisplay.textContent = `${getMonthName(month)} ${day}${ordinal}, ${year}`;
        dayDisplay.textContent = dayName;

        // Timezone
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        timezoneEl.textContent = tz.replace(/_/g, ' ');
      }

      // ----- start clock -----
      function startClock() {
        if (clockInterval) {
          clearInterval(clockInterval);
        }
        updateClock(); // immediate update
        clockInterval = setInterval(updateClock, 1000);
      }

      // ----- format toggle -----
      function setFormat(format) {
        currentFormat = format;
        formatButtons.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.format === format);
        });
        updateClock();
      }

      // ----- refresh (resync) -----
      function refreshClock() {
        updateClock();
        // subtle visual feedback
        refreshBtn.style.opacity = '0.5';
        setTimeout(() => {
          refreshBtn.style.opacity = '1';
        }, 200);
      }

      // ----- fullscreen toggle -----
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.() ||
          document.documentElement.webkitRequestFullscreen?.();
        } else {
          document.exitFullscreen?.() ||
          document.webkitExitFullscreen?.();
        }
      }

      // ----- event listeners -----
      formatButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          setFormat(btn.dataset.format);
        });
      });

      refreshBtn.addEventListener('click', refreshClock);
      fullscreenBtn.addEventListener('click', toggleFullscreen);

      // Keyboard shortcut: 'f' for fullscreen, 'r' for refresh
      document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullscreen();
        }
        if (e.key === 'r' || e.key === 'R') {
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            refreshClock();
          }
        }
        if (e.key === '1') {
          setFormat('12');
        }
        if (e.key === '2') {
          setFormat('24');
        }
      });

      // ----- init -----
      startClock();

      // set initial format from active button
      const activeBtn = document.querySelector('.format-toggle button.active');
      if (activeBtn) {
        currentFormat = activeBtn.dataset.format;
      }

      console.log('✅ Digital Clock');
      console.log('   ⌨️  1 = 12h  |  2 = 24h  |  r = refresh  |  f = fullscreen');
    })();
  </script>
</body>
</html>
