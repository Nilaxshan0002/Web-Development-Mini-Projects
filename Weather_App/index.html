<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherWise</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== MAIN APP ===== -->
  <div class="weather-card" id="app">

    <!-- Header -->
    <div class="app-header">
      <span class="brand"><i class="fas fa-cloud-sun"></i> WeatherWise</span>
      <span class="download-btn" id="downloadBtn">
        <i class="fas fa-download"></i> Download App
      </span>
    </div>

    <!-- Search -->
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="cityInput" placeholder="Search city..." value="New York" />
      <button id="searchBtn"><i class="fas fa-arrow-right"></i> Search</button>
    </div>

    <!-- Weather Display -->
    <div id="weatherDisplay">
      <div class="weather-main">
        <div class="city-row">
          <span class="city-name"><i class="fas fa-location-dot"></i> <span id="cityName">New York</span></span>
          <span class="temp-big">
            <span id="tempValue">--</span><span class="deg">°C</span>
          </span>
        </div>
        <div class="sub-info">
          <span id="countryName">USA</span>
          <span id="timeDisplay">--:--</span>
          <span id="dateDisplay">---</span>
        </div>
      </div>

      <!-- Condition -->
      <div class="condition-row">
        <span class="condition-left">
          <i class="fas fa-cloud" id="conditionIcon"></i>
          <span id="weatherDesc">Loading...</span>
        </span>
        <span class="feels-like">
          <i class="fas fa-temperature-half"></i> Feels <span id="feelsLike">--</span>°C
        </span>
      </div>
      <div id="errorContainer"></div>
    </div>

    <!-- Forecast -->
    <div class="forecast-section">
      <div class="forecast-label"><i class="fas fa-calendar-week"></i> 5-DAY FORECAST</div>
      <div class="forecast-grid" id="forecastGrid">
        <!-- injected by JS -->
      </div>
    </div>

    <!-- Features -->
    <div class="features-line">
      <span><i class="fas fa-city"></i> Search by City</span>
      <span><i class="fas fa-temperature-high"></i> Temperature & Forecast</span>
      <span><i class="fas fa-icons"></i> Dynamic Icons</span>
    </div>

    <!-- Footer -->
    <div class="footer-meta">
      <span><i class="fas fa-code"></i> Weather App · Top 5 Projects</span>
      <span><i class="fas fa-clock"></i> 2 days ago</span>
    </div>
  </div>

  <!-- External JavaScript -->
  <script src="api-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
