<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player-card">
    <!-- header -->
    <div class="header">
      <h1>🎵 Music Player</h1>
      <div class="badge-group">
        <span class="badge live">● live</span>
      </div>
    </div>

    <!-- album art -->
    <div class="album-art" id="albumArt">
      <div class="art-gradient" id="artGradient"></div>
      <div class="art-placeholder" id="artPlaceholder">🎵</div>
    </div>

    <!-- song info -->
    <div class="song-info">
      <div class="song-title" id="songTitle">Night Drive</div>
      <div class="song-artist" id="songArtist">Code Beats</div>
    </div>

    <!-- progress -->
    <div class="progress-section">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <!-- controls -->
    <div class="controls">
      <button class="control-btn" id="prevBtn" title="Previous">⏮</button>
      <button class="control-btn play-btn" id="playBtn" title="Play/Pause">▶</button>
      <button class="control-btn" id="nextBtn" title="Next">⏭</button>
    </div>

    <!-- volume -->
    <div class="volume-section">
      <span class="volume-icon" id="volumeIcon">🔊</span>
      <div class="volume-bar" id="volumeBar">
        <div class="volume-fill" id="volumeFill"></div>
      </div>
      <span class="volume-level" id="volumeLevel">80%</span>
    </div>

    <!-- playlist toggle -->
    <div class="playlist-toggle">
      <button id="playlistToggleBtn">📋 Playlist (15 songs)</button>
      <div class="playlist" id="playlist"></div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
