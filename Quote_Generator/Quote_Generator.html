<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Generator</title>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 30% 10%, #0f1428, #05060d 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.8rem;
    }

    .quote-card {
      max-width: 720px;
      width: 100%;
      background: rgba(18, 22, 42, 0.8);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border-radius: 3.6rem;
      padding: 3rem 2.8rem 3.2rem;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* subtle glow */
    .quote-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(75, 124, 247, 0.06), transparent 60%);
      pointer-events: none;
    }

    /* ----- header ----- */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f0f4ff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .badge-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(75, 124, 247, 0.12);
      color: #7a9cff;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      padding: 0.25rem 0.9rem;
      border-radius: 60px;
      text-transform: uppercase;
      border: 1px solid rgba(75, 124, 247, 0.12);
      backdrop-filter: blur(2px);
    }

    .badge.live {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.15);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .subhead {
      color: #8d9bc9;
      font-size: 0.85rem;
      font-weight: 400;
      border-left: 3px solid #4b7cf7;
      padding-left: 1rem;
      margin: 0.3rem 0 2rem 0;
      background: rgba(75, 124, 247, 0.04);
      border-radius: 0 12px 12px 0;
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }

    /* ----- quote display ----- */
    .quote-display {
      text-align: center;
      padding: 1.5rem 0.5rem 1rem;
      position: relative;
      z-index: 1;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .quote-icon {
      font-size: 3rem;
      color: rgba(75, 124, 247, 0.15);
      line-height: 1;
      font-family: Georgia, serif;
      transition: all 0.3s ease;
    }

    .quote-icon.close {
      margin-top: -0.5rem;
      align-self: flex-end;
    }

    .quote-text {
      font-size: 1.6rem;
      font-weight: 400;
      color: #f0f4ff;
      line-height: 1.7;
      margin: 0.5rem 0 0.2rem;
      padding: 0 0.5rem;
      transition: all 0.4s ease;
      font-style: italic;
      letter-spacing: 0.02em;
      max-width: 90%;
    }

    .quote-text.fade {
      opacity: 0;
      transform: translateY(10px);
    }

    .quote-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ----- author section ----- */
    .author-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin: 0.5rem 0 1.5rem;
      position: relative;
      z-index: 1;
    }

    .author-line {
      color: #4b7cf7;
      font-size: 1.5rem;
      font-weight: 300;
      opacity: 0.6;
    }

    .author-name {
      color: #8d9bc9;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.4s ease;
    }

    .author-name.fade {
      opacity: 0;
      transform: translateX(-10px);
    }

    .author-name.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* ----- quote counter ----- */
    .quote-counter {
      text-align: center;
      color: #5a6a94;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      margin-bottom: 1.8rem;
      position: relative;
      z-index: 1;
    }

    .quote-counter span {
      color: #7a9cff;
      font-weight: 600;
    }

    /* ----- action section ----- */
    .action-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding-top: 1.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      position: relative;
      z-index: 1;
    }

    .btn-primary {
      background: linear-gradient(145deg, #4b7cf7, #3a65d9);
      border: none;
      padding: 0.7rem 2.4rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      color: white;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 6px 18px rgba(75, 124, 247, 0.3);
      letter-spacing: 0.4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 28px rgba(75, 124, 247, 0.45);
      background: linear-gradient(145deg, #5a87ff, #3f6be0);
    }

    .btn-primary:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #2a3150;
      color: #6a7aa8;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #4b5a85;
      color: #b3c4f0;
    }

    .btn-secondary:active {
      transform: scale(0.94);
    }

    .btn-secondary.copied {
      border-color: #4ade80;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.1);
    }

    /* ----- toast notification ----- */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(18, 22, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 0.8rem 2rem;
      border-radius: 60px;
      border: 1px solid rgba(75, 124, 247, 0.2);
      color: #b3c4f0;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ----- responsive ----- */
    @media (max-width: 650px) {
      .quote-card {
        padding: 2rem 1.5rem 2.2rem;
        border-radius: 2.4rem;
      }
      .quote-text {
        font-size: 1.3rem;
      }
      .quote-icon {
        font-size: 2.2rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .action-section {
        flex-direction: column;
      }
      .btn-primary {
        width: 100%;
        justify-content: center;
      }
      .btn-secondary {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 420px) {
      .quote-card {
        padding: 1.5rem 1rem 1.8rem;
        border-radius: 2rem;
      }
      .quote-text {
        font-size: 1.1rem;
      }
      .author-name {
        font-size: 0.95rem;
      }
      .subhead {
        font-size: 0.75rem;
        padding-left: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="quote-card">
    <!-- header -->
    <div class="header">
      <h1>💬 Quote Generator</h1>
      <div class="badge-group">
        <span class="badge live">● live</span>
      </div>
    </div>
    <div class="subhead">
      Discover wisdom, one quote at a time — click the button for a new insight.
    </div>

    <!-- quote display -->
    <div class="quote-display" id="quoteDisplay">
      <div class="quote-icon">❝</div>
      <p class="quote-text show" id="quoteText">
        Code is simple when logic is clear.
      </p>
      <div class="quote-icon close">❞</div>
    </div>

    <!-- author -->
    <div class="author-section">
      <span class="author-line">—</span>
      <span class="author-name show" id="authorName">Developer Mindset</span>
    </div>

    <!-- quote counter -->
    <div class="quote-counter" id="quoteCounter">
      Quote <span id="currentQuoteNum">1</span> of <span id="totalQuotes">0</span>
    </div>

    <!-- actions -->
    <div class="action-section">
      <button class="btn-primary" id="newQuoteBtn">
        <span>✨</span> New Quote
      </button>
      <button class="btn-secondary" id="copyBtn">
        📋 Copy
      </button>
      <button class="btn-secondary" id="shareBtn">
        🔗 Share
      </button>
    </div>
  </div>

  <!-- toast notification -->
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      "use strict";

      // ----- quotes data -----
      const quotes = [
        {
          text: "Code is simple when logic is clear.",
          author: "Developer Mindset"
        },
        {
          text: "The only way to learn a new programming language is by writing programs in it.",
          author: "Dennis Ritchie"
        },
        {
          text: "Any fool can write code that a computer can understand. Good programmers write code that humans can understand.",
          author: "Martin Fowler"
        },
        {
          text: "First, solve the problem. Then, write the code.",
          author: "John Johnson"
        },
        {
          text: "Experience is the name everyone gives to their mistakes.",
          author: "Oscar Wilde"
        },
        {
          text: "In order to be irreplaceable, one must always be different.",
          author: "Coco Chanel"
        },
        {
          text: "The best way to predict the future is to create it.",
          author: "Peter Drucker"
        },
        {
          text: "Simplicity is the soul of efficiency.",
          author: "Austin Freeman"
        },
        {
          text: "Good design adds value faster than it adds cost.",
          author: "Thomas C. Gale"
        },
        {
          text: "The function of good software is to make the complex appear to be simple.",
          author: "Grady Booch"
        },
        {
          text: "Sometimes it pays to stay in bed on Monday, rather than spending the rest of the week debugging Monday's code.",
          author: "Dan Salomon"
        },
        {
          text: "Perfection is achieved not when there is nothing more to add, but rather when there is nothing more to take away.",
          author: "Antoine de Saint-Exupéry"
        },
        {
          text: "The most damaging phrase in the language is: 'It's always been done that way.'",
          author: "Grace Hopper"
        },
        {
          text: "Think twice, code once.",
          author: "Anonymous"
        },
        {
          text: "The expert in anything was once a beginner.",
          author: "Helen Hayes"
        }
      ];

      // ----- DOM refs -----
      const quoteText = document.getElementById('quoteText');
      const authorName = document.getElementById('authorName');
      const newQuoteBtn = document.getElementById('newQuoteBtn');
      const copyBtn = document.getElementById('copyBtn');
      const shareBtn = document.getElementById('shareBtn');
      const currentQuoteNum = document.getElementById('currentQuoteNum');
      const totalQuotes = document.getElementById('totalQuotes');
      const toast = document.getElementById('toast');

      // ----- state -----
      let currentIndex = 0;
      let quoteHistory = [];
      let isTransitioning = false;

      // ----- initialize counter -----
      totalQuotes.textContent = quotes.length;

      // ----- show quote with animation -----
      function showQuote(index, animate = true) {
        if (isTransitioning) return;
        
        const quote = quotes[index];
        if (!quote) return;

        currentIndex = index;
        currentQuoteNum.textContent = index + 1;

        if (animate) {
          isTransitioning = true;
          
          // Fade out
          quoteText.classList.remove('show');
          quoteText.classList.add('fade');
          authorName.classList.remove('show');
          authorName.classList.add('fade');

          setTimeout(() => {
            // Update content
            quoteText.textContent = quote.text;
            authorName.textContent = quote.author;
            
            // Fade in
            quoteText.classList.remove('fade');
            quoteText.classList.add('show');
            authorName.classList.remove('fade');
            authorName.classList.add('show');
            
            isTransitioning = false;
          }, 300);
        } else {
          // Instant update (for initial load)
          quoteText.textContent = quote.text;
          authorName.textContent = quote.author;
          quoteText.classList.add('show');
          authorName.classList.add('show');
        }

        // Track history
        quoteHistory.push(index);
        if (quoteHistory.length > 50) quoteHistory.shift();
      }

      // ----- get random quote (different from current) -----
      function getRandomQuote() {
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * quotes.length);
        } while (newIndex === currentIndex && quotes.length > 1);
        return newIndex;
      }

      // ----- new quote -----
      function newQuote() {
        if (isTransitioning) return;
        const newIndex = getRandomQuote();
        showQuote(newIndex, true);
      }

      // ----- copy quote -----
      function copyQuote() {
        const quote = quotes[currentIndex];
        const text = `"${quote.text}" — ${quote.author}`;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast('📋 Copied to clipboard!');
            copyBtn.classList.add('copied');
            setTimeout(() => copyBtn.classList.remove('copied'), 2000);
          }).catch(() => {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('📋 Copied to clipboard!');
          copyBtn.classList.add('copied');
          setTimeout(() => copyBtn.classList.remove('copied'), 2000);
        } catch (err) {
          showToast('❌ Failed to copy');
        }
        document.body.removeChild(textarea);
      }

      // ----- share quote -----
      function shareQuote() {
        const quote = quotes[currentIndex];
        const text = `"${quote.text}" — ${quote.author}`;
        
        if (navigator.share) {
          navigator.share({
            title: 'Quote',
            text: text,
          }).catch(() => {});
        } else {
          // Fallback: copy to clipboard
          copyQuote();
          showToast('📋 Quote copied for sharing!');
        }
      }

      // ----- toast notification -----
      let toastTimeout = null;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }

      // ----- keyboard shortcuts -----
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          newQuote();
        }
        if (e.key === 'c' || e.key === 'C') {
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            copyQuote();
          }
        }
        if (e.key === 's' || e.key === 'S') {
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            shareQuote();
          }
        }
      });

      // ----- event listeners -----
      newQuoteBtn.addEventListener('click', newQuote);
      copyBtn.addEventListener('click', copyQuote);
      shareBtn.addEventListener('click', shareQuote);

      // Double-click on quote to copy
      quoteText.addEventListener('dblclick', copyQuote);
      authorName.addEventListener('dblclick', copyQuote);

      // ----- init -----
      // Show a random quote on load
      const initialIndex = Math.floor(Math.random() * quotes.length);
      showQuote(initialIndex, false);

      console.log('✅ Quote Generator');
      console.log('   ⌨️  Space = new quote  |  c = copy  |  s = share');
      console.log(`   📚 ${quotes.length} quotes loaded`);
    })();
  </script>
</body>
</html>
