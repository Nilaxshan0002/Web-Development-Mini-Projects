<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Palette Picker</title>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 30% 10%, #0f1428, #05060d 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.8rem;
    }

    .palette-card {
      max-width: 860px;
      width: 100%;
      background: rgba(18, 22, 42, 0.8);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border-radius: 3.6rem;
      padding: 3rem 2.8rem 3.2rem;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .palette-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(75, 124, 247, 0.06), transparent 60%);
      pointer-events: none;
    }

    /* ----- header ----- */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f0f4ff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .badge-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(75, 124, 247, 0.12);
      color: #7a9cff;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      padding: 0.25rem 0.9rem;
      border-radius: 60px;
      text-transform: uppercase;
      border: 1px solid rgba(75, 124, 247, 0.12);
      backdrop-filter: blur(2px);
    }

    .badge.live {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.15);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .subhead {
      color: #8d9bc9;
      font-size: 0.85rem;
      font-weight: 400;
      border-left: 3px solid #4b7cf7;
      padding-left: 1rem;
      margin: 0.3rem 0 2rem 0;
      background: rgba(75, 124, 247, 0.04);
      border-radius: 0 12px 12px 0;
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }

    /* ----- palette display ----- */
    .palette-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin: 1.5rem 0 2rem;
      position: relative;
      z-index: 1;
    }

    .color-item {
      position: relative;
      border-radius: 1.2rem;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      background: #1a1f33;
    }

    .color-item:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.15);
      z-index: 2;
    }

    .color-item:active {
      transform: scale(0.95);
    }

    .color-item .color-preview {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 1.2rem;
      transition: all 0.4s ease;
    }

    .color-item .color-info {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      color: white;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .color-item .lock-icon {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      z-index: 3;
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      padding: 0.2rem 0.4rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
      opacity: 0;
      transform: scale(0.8);
      cursor: pointer;
    }

    .color-item:hover .lock-icon {
      opacity: 1;
      transform: scale(1);
    }

    .color-item .lock-icon.locked {
      opacity: 1;
      transform: scale(1);
      background: rgba(251, 191, 36, 0.2);
      border-color: rgba(251, 191, 36, 0.3);
    }

    .color-item .copy-feedback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 4;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .color-item .copy-feedback.show {
      transform: translate(-50%, -50%) scale(1);
    }

    /* ----- controls ----- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding-top: 1.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      position: relative;
      z-index: 1;
    }

    .btn-primary {
      background: linear-gradient(145deg, #4b7cf7, #3a65d9);
      border: none;
      padding: 0.7rem 2.4rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      color: white;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 6px 18px rgba(75, 124, 247, 0.3);
      letter-spacing: 0.4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 28px rgba(75, 124, 247, 0.45);
      background: linear-gradient(145deg, #5a87ff, #3f6be0);
    }

    .btn-primary:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #2a3150;
      color: #6a7aa8;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #4b5a85;
      color: #b3c4f0;
    }

    .btn-secondary:active {
      transform: scale(0.94);
    }

    .btn-secondary.active {
      background: rgba(251, 191, 36, 0.15);
      border-color: rgba(251, 191, 36, 0.3);
      color: #fbbf24;
    }

    /* ----- toast ----- */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(18, 22, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 0.8rem 2rem;
      border-radius: 60px;
      border: 1px solid rgba(75, 124, 247, 0.2);
      color: #b3c4f0;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ----- responsive ----- */
    @media (max-width: 700px) {
      .palette-container {
        grid-template-columns: repeat(3, 1fr);
        gap: 0.8rem;
      }
      .color-item {
        height: 140px;
      }
    }

    @media (max-width: 650px) {
      .palette-card {
        padding: 2rem 1.5rem 2.2rem;
        border-radius: 2.4rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .controls {
        flex-direction: column;
      }
      .btn-primary {
        width: 100%;
        justify-content: center;
      }
      .btn-secondary {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 500px) {
      .palette-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.6rem;
      }
      .color-item {
        height: 120px;
      }
      .color-item .color-info {
        font-size: 0.6rem;
        padding: 0.3rem 0.6rem;
      }
    }

    @media (max-width: 420px) {
      .palette-card {
        padding: 1.5rem 1rem 1.8rem;
        border-radius: 2rem;
      }
      .subhead {
        font-size: 0.75rem;
        padding-left: 0.7rem;
      }
      .color-item {
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="palette-card">
    <!-- header -->
    <div class="header">
      <h1>🎨 Color Palette</h1>
      <div class="badge-group">
        <span class="badge live">● live</span>
      </div>
    </div>
    <div class="subhead">
      Generate random color palettes — click any color to copy its hex code.
    </div>

    <!-- palette -->
    <div class="palette-container" id="paletteContainer">
      <!-- colors will be generated here -->
    </div>

    <!-- controls -->
    <div class="controls">
      <button class="btn-primary" id="generateBtn">
        <span>✨</span> Generate Palette
      </button>
      <button class="btn-secondary" id="lockAllBtn">🔒 Lock All</button>
      <button class="btn-secondary" id="unlockAllBtn">🔓 Unlock All</button>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      "use strict";

      // ----- DOM refs -----
      const paletteContainer = document.getElementById('paletteContainer');
      const generateBtn = document.getElementById('generateBtn');
      const lockAllBtn = document.getElementById('lockAllBtn');
      const unlockAllBtn = document.getElementById('unlockAllBtn');
      const toast = document.getElementById('toast');

      // ----- state -----
      let colors = [];
      let locked = [];
      const PALETTE_SIZE = 5;

      // ----- helpers -----
      function generateRandomColor() {
        const hex = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        return hex;
      }

      function getContrastColor(hex) {
        // Remove # if present
        const color = hex.replace('#', '');
        const r = parseInt(color.substr(0, 2), 16);
        const g = parseInt(color.substr(2, 2), 16);
        const b = parseInt(color.substr(4, 2), 16);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luminance > 0.5 ? '#1a1a2e' : '#ffffff';
      }

      function getTextColorForInfo(hex) {
        // For the info badge background
        const color = hex.replace('#', '');
        const r = parseInt(color.substr(0, 2), 16);
        const g = parseInt(color.substr(2, 2), 16);
        const b = parseInt(color.substr(4, 2), 16);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luminance > 0.5 ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.9)';
      }

      // ----- generate palette -----
      function generatePalette() {
        for (let i = 0; i < PALETTE_SIZE; i++) {
          if (!locked[i]) {
            colors[i] = generateRandomColor();
          }
        }
        renderPalette();
      }

      // ----- render palette -----
      function renderPalette() {
        paletteContainer.innerHTML = '';
        
        for (let i = 0; i < PALETTE_SIZE; i++) {
          const color = colors[i] || '#2a2a4a';
          const isLocked = locked[i] || false;
          
          const colorItem = document.createElement('div');
          colorItem.className = 'color-item';
          colorItem.dataset.index = i;
          
          // Color preview
          const preview = document.createElement('div');
          preview.className = 'color-preview';
          preview.style.background = color;
          
          // Lock icon
          const lockIcon = document.createElement('span');
          lockIcon.className = `lock-icon${isLocked ? ' locked' : ''}`;
          lockIcon.textContent = isLocked ? '🔒' : '🔓';
          lockIcon.title = isLocked ? 'Unlock this color' : 'Lock this color';
          lockIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleLock(i);
          });
          
          // Copy feedback
          const feedback = document.createElement('div');
          feedback.className = 'copy-feedback';
          feedback.textContent = '✅ Copied!';
          
          // Color info (hex code)
          const info = document.createElement('span');
          info.className = 'color-info';
          info.textContent = color.toUpperCase();
          info.style.background = `rgba(0,0,0,0.6)`;
          info.style.color = getContrastColor(color);
          
          // Click to copy
          colorItem.addEventListener('click', () => {
            copyColor(color, feedback);
          });
          
          colorItem.appendChild(preview);
          colorItem.appendChild(lockIcon);
          colorItem.appendChild(feedback);
          colorItem.appendChild(info);
          
          paletteContainer.appendChild(colorItem);
        }
      }

      // ----- toggle lock -----
      function toggleLock(index) {
        locked[index] = !locked[index];
        renderPalette();
        showToast(locked[index] ? '🔒 Color locked' : '🔓 Color unlocked');
      }

      // ----- lock all -----
      function lockAll() {
        for (let i = 0; i < PALETTE_SIZE; i++) {
          locked[i] = true;
        }
        renderPalette();
        showToast('🔒 All colors locked');
      }

      // ----- unlock all -----
      function unlockAll() {
        for (let i = 0; i < PALETTE_SIZE; i++) {
          locked[i] = false;
        }
        renderPalette();
        showToast('🔓 All colors unlocked');
      }

      // ----- copy color -----
      function copyColor(color, feedbackElement) {
        const text = color.toUpperCase();
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showCopyFeedback(feedbackElement);
            showToast(`✅ ${text} copied!`);
          }).catch(() => {
            fallbackCopy(text, feedbackElement);
          });
        } else {
          fallbackCopy(text, feedbackElement);
        }
      }

      function fallbackCopy(text, feedbackElement) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showCopyFeedback(feedbackElement);
          showToast(`✅ ${text} copied!`);
        } catch (err) {
          showToast('❌ Failed to copy');
        }
        document.body.removeChild(textarea);
      }

      function showCopyFeedback(element) {
        element.classList.add('show');
        setTimeout(() => {
          element.classList.remove('show');
        }, 1500);
      }

      // ----- toast -----
      let toastTimeout = null;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 2500);
      }

      // ----- keyboard shortcuts -----
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          generatePalette();
        }
        if (e.key === 'l' || e.key === 'L') {
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            lockAll();
          }
        }
        if (e.key === 'u' || e.key === 'U') {
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            unlockAll();
          }
        }
      });

      // ----- event listeners -----
      generateBtn.addEventListener('click', generatePalette);
      lockAllBtn.addEventListener('click', lockAll);
      unlockAllBtn.addEventListener('click', unlockAll);

      // ----- init -----
      // Initialize with random colors
      for (let i = 0; i < PALETTE_SIZE; i++) {
        colors[i] = generateRandomColor();
        locked[i] = false;
      }
      renderPalette();

      console.log('✅ Color Palette Picker');
      console.log('   ⌨️  Space = generate  |  l = lock all  |  u = unlock all');
      console.log('   🎨 Click any color to copy hex code');
    })();
  </script>
</body>
</html>
